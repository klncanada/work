*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;background:var(--bg-grad);background-attachment:fixed}
body{margin:0;min-height:100vh;background:var(--bg-grad);background-attachment:fixed;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.ver{font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--card-border);border-radius:999px;background:var(--card-grad)}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--card-grad);border:1px solid var(--card-border);box-shadow:var(--shadow)}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500}
.lang button.on{background:var(--btn-grad);color:#fff}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card-grad);border:1px solid var(--card-border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg);color:var(--ink);font-size:16px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.prov{display:flex;gap:6px}
.prov button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--input-bg);color:var(--ink);border-radius:8px;cursor:pointer;font-size:14px}
.prov button.on{background:var(--btn-grad);border-color:transparent;color:#fff}
.main{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:center;margin-top:16px}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.chart{position:relative;width:100%;max-width:300px;margin:0 auto}
.chart svg{display:block;width:100%;height:auto}
.chart path{cursor:pointer;stroke:var(--input-bg);stroke-width:2;transition:opacity .15s}
.chart.hovering path:not(.hl){opacity:.35}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 70px}
.center .l{font-size:12px;color:var(--muted)}
.center .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.center .s{font-size:12px;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--card-grad);border:1px solid var(--card-border);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;display:none;z-index:2;backdrop-filter:blur(6px)}
.tip b{display:block;font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
td .n{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-left:18px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:baseline}
tbody tr.hl td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:none}
tr.net td{font-weight:600;border-bottom:none}
.tbl-scroll{overflow-x:auto}
h2{font-size:15px;margin:0 0 10px}
.ref{margin-top:16px}
.ref td,.ref th{font-size:13px}
.ref td:nth-child(2){white-space:nowrap;text-align:left}
.ref td:nth-child(3){text-align:left}
.notes{color:var(--muted);font-size:12.5px;margin:14px 0 0;padding-left:18px}
.notes li{margin:3px 0}
.warn{color:var(--warn)}
.prov button.cmp{flex:1.8;white-space:nowrap;padding:9px 8px}
#cmpView{position:relative;margin-top:18px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.legend span{display:inline-flex;align-items:center}
.multiples{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.panel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--input-bg)}
.panel h3{font-size:13px;font-weight:600;margin:0 0 10px}
.panel.key{border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.bar-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;height:26px;cursor:default}
.bar-row .pl{font-size:12px;color:var(--muted);font-weight:500}
.bar-track{position:relative;height:14px}
.bar{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;transition:width .25s,opacity .15s}
.bar-row .val{font-size:12.5px;font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
.bar-row .val.na{color:var(--muted)}
.multiples.hovering .bar-row:not(.hl) .bar{opacity:.35}
.cmp-tbl td.best{font-weight:600}
.cmp-tbl td.best::after{content:" ✓";color:var(--muted)}
.cmp-tbl td,.cmp-tbl th{white-space:nowrap}

.topbar{flex-wrap:wrap}
.navwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.home:hover{color:var(--accent)}
.home::before{content:"← ";color:var(--muted)}
.nav{display:inline-flex;padding:3px;border-radius:999px;background:var(--card-grad);border:1px solid var(--card-border);box-shadow:var(--shadow)}
.nav a{color:var(--muted);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
.nav a.on{background:var(--btn-grad);color:#fff}
.nav a:not(.on):hover{color:var(--ink)}
</style>
</head>

    colItem:'Élément', colAmount:'Annuel', colPct:'% du salaire',
    fed:'Impôt fédéral', provTax:p=>`Impôt provincial (${p})`,
    pen:{CPP:'RPC – Régime de pensions du Canada',QPP:'RRQ – Régime de rentes du Québec'},
    pen2:{CPP2:'RPC2 – deuxième cotisation supplémentaire',QPP2:'RRQ2 – deuxième cotisation supplémentaire'},
    ei:'AE – Assurance-emploi', qpip:'RQAP – Régime québécois d’assurance parentale',
    total:'Total des retenues', net:'Salaire net', effMarg:'Taux d’imposition effectif / marginal (approx.)',
    nTaxable:v=>`Revenu imposable ${v}`,
    nQcFed:(b,a)=>`Impôt fédéral de base ${b} − abattement du Québec 16,5 % ${a}`,
    nON:(b,s,r,o)=>`Impôt de base ${b} + surtaxe ${s} − réduction d’impôt ${r} + contribution-santé de l’Ontario ${o}`,
    nBC:(b,r)=>`Impôt de base ${b} − réduction d’impôt de la C.-B. ${r}`,
    nQC:w=>`Après déduction pour travailleur ${w}`,
    nPen:(r,y,e)=>`${r} × (min(salaire, ${y}) − ${e})`,
    nPen2:(y,a)=>`4 % × gains entre ${y} et ${a}`,
    nEI:(r,m,qc)=>`${r}, maximum assurable ${m}${qc?' (taux réduit Québec)':''}`,
    nQPIP:(r,m)=>`${r}, maximum assurable ${m}`,
    refTitle:'Taux 2026 – employé', refCols:['Élément','Taux / tranche','Règles'],
    above:'et plus', fedTaxRow:'Impôt fédéral', provTaxRow:p=>`Impôt – ${p}`,
    rFed:(qc)=>`Montant personnel de base 16 452 $ (réduit à 14 829 $ entre 181 440 $ et 258 482 $) · Montant canadien pour emploi 1 501 $ · taux de crédit 14 %${qc?' · abattement du Québec 16,5 %':''}`,
    rProv:{
      ON:'Montant personnel de base 12 989 $, taux de crédit 5,05 % · Surtaxe : 20 % de l’impôt de base au-delà de 5 818 $, plus 36 % au-delà de 7 446 $ · Réduction d’impôt de base 300 $ · Contribution-santé de l’Ontario jusqu’à 900 $',
      BC:'Montant personnel de base 13 216 $, taux de crédit 5,6 % · Réduction d’impôt de la C.-B. jusqu’à 690 $, réduite de 3,56 % du revenu au-delà de 25 570 $, nulle à 44 952 $',
      QC:'Montant personnel de base 18 952 $, taux de crédit 14 % · Déduction pour travailleur 6 %, max. 1 450 $ · Aucun crédit au Québec pour RRQ/AE/RQAP'
    },
    rPen:(e,y,m)=>`${e} – ${y}, max. ${m}`, rPen2:(y,a)=>`${y} – ${a}, max. 416,00 $`,
    rCap:(m,x)=>`Maximum assurable ${m}, cotisation max. ${x}`,
    notes:[
      'Calcul annualisé, en supposant uniquement un revenu d’emploi et le seul montant personnel de base (code de demande 1), sans autres déductions ni crédits. Pour les retenues réelles : PDOC de l’ARC / WinRAS de Revenu Québec.',
      'La première cotisation supplémentaire RPC/RRQ (1 %) et la totalité du RPC2/RRQ2 sont déduites du revenu imposable; la cotisation de base (RPC 4,95 % / RRQ 5,30 %) donne droit à un crédit.',
      'En 2026, le taux de base du RRQ passe de 5,40 % à 5,30 % (6,30 % au total); le taux fédéral le plus bas est de 14 % pour toute l’année.'
    ],
    noteON:'Ontario : le crédit LIFT n’est pas inclus (comme dans les tables de retenues de l’ARC).',
    compareBtn:'Comparer', cmpTableTitle:'Comparaison des provinces',
    cmp:{fed:'Impôt fédéral',prov:'Impôt provincial',pen:'RPC / RRQ',pen2:'RPC2 / RRQ2',ei:'AE',qpip:'RQAP (Québec seulement)',tot:'Total des retenues',net:'Salaire net'},
    na:'s.o.', bestNote:'✓ = retenue la plus basse des trois (la plus élevée pour le salaire net)', cmpNote:'Chaque panneau a sa propre échelle; comparez les barres à l’intérieur d’un même panneau.',
    noteBC:'C.-B. : le budget 2026 fait passer le taux le plus bas de 5,06 % à 5,60 % pour toute l’année et la réduction d’impôt de la C.-B. à 690 $. Cet outil montre l’impôt annuel réel; les retenues de l’ARC utilisent 5,06 % de janvier à juin et un taux proratisé de 6,14 % de juillet à décembre, d’où un écart par période.'
  }
};

function detectLang(){
  try{ const q=new URLSearchParams(location.search).get('lang'); if(I18N[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem('payroll26-lang'); if(I18N[s]) return s; }catch(e){}
  for(const l of (navigator.languages||[navigator.language||'en'])){
    const p=String(l).toLowerCase().slice(0,2);
    if(p==='zh') return 'zh'; if(p==='fr') return 'fr'; if(p==='en') return 'en';
  }
  return 'en';
}
let lang = detectLang();
const T = () => I18N[lang];

/* ===================== HELPERS ===================== */
const r2 = x => Math.round(x*100)/100;
const fmt = x => new Intl.NumberFormat(T().locale,{style:'currency',currency:'CAD',currencyDisplay:'narrowSymbol',minimumFractionDigits:2,maximumFractionDigits:2}).format(x);
const fmt0 = x => new Intl.NumberFormat(T().locale,{style:'currency',currency:'CAD',currencyDisplay:'narrowSymbol',maximumFractionDigits:0}).format(x);
const pct = (x,d=2) => new Intl.NumberFormat(T().locale,{style:'percent',maximumFractionDigits:d}).format(x);
const num = s => { const v=parseFloat(String(s).replace(/\s| | /g,'').replace(/[^0-9.,\-]/g,'').replace(/,(?=\d{1,2}$)/,'.').replace(/,/g,'')); return isFinite(v)?v:0; };
const progressive = (inc,br) => { let t=0,lo=0; for(const [hi,r] of br){ if(inc>lo) t+=(Math.min(inc,hi)-lo)*r; lo=hi; } return t; };
const marginal = (inc,br) => { for(const [hi,r] of br) if(inc<=hi) return r; };

/* ===================== CALC (employee only) ===================== */
function calc(sal, prov){
  const isQC = prov==='QC', P = isQC?R.qpp:R.cpp, E = isQC?R.eiQC:R.ei;
  const pen = r2(Math.max(0, Math.min(sal,P.ympe)-P.exempt) * P.rate);
  const penBase = pen*(P.base/P.rate), penEnh = pen-penBase;
  const pen2 = r2(Math.max(0, Math.min(sal,P.yampe)-P.ympe) * P.r2);
  const ei = r2(Math.min(sal,E.mie)*E.rate);
  const qpip = isQC ? r2(Math.min(sal,R.qpip.mie)*R.qpip.rate) : 0;

  const F = R.fed;
  const fedTaxable = Math.max(0, sal-penEnh-pen2);
  let bpa = F.bpaMax;
  if(fedTaxable>F.bpaFrom) bpa = F.bpaMax - Math.min(1,(fedTaxable-F.bpaFrom)/(F.bpaTo-F.bpaFrom))*(F.bpaMax-F.bpaMin);
  const fedBasic = Math.max(0, progressive(fedTaxable,F.brackets) - (bpa+Math.min(F.cea,sal)+penBase+ei+qpip)*F.credit);
  const abatement = isQC ? fedBasic*F.qcAbatement : 0;
  const fedTax = r2(fedBasic-abatement);

  const S = R[prov]; let provTaxable, provTax, d={};
  if(prov==='QC'){
    d.wd = Math.min(sal*S.workerDed.rate, S.workerDed.max);
    provTaxable = Math.max(0, sal-penEnh-pen2-d.wd);
    provTax = Math.max(0, progressive(provTaxable,S.brackets) - S.bpa*S.credit);
  } else if(prov==='ON'){
    provTaxable = fedTaxable;
    d.basic = Math.max(0, progressive(provTaxable,S.brackets) - (S.bpa+penBase+ei)*S.credit);
    d.surtax = 0; for(const [th,rt] of S.surtax) if(d.basic>th) d.surtax += (d.basic-th)*rt;
    const t = d.basic+d.surtax;
    d.reduction = Math.max(0, Math.min(t, 2*S.reductionBase-t));
    const ti = provTaxable; let o=0;
    if(ti>200000) o=Math.min(900,750+.25*(ti-200000));
    else if(ti>72000) o=Math.min(750,600+.25*(ti-72000));
    else if(ti>48000) o=Math.min(600,450+.25*(ti-48000));
    else if(ti>36000) o=Math.min(450,300+.06*(ti-36000));
    else if(ti>20000) o=Math.min(300,.06*(ti-20000));
    d.ohp = o;
    provTax = t-d.reduction+o;
  } else {
    provTaxable = fedTaxable;
    d.basic = Math.max(0, progressive(provTaxable,S.brackets) - (S.bpa+penBase+ei)*S.credit);
    d.reduction = Math.min(d.basic, Math.max(0, S.red.max - Math.max(0,provTaxable-S.red.from)*S.red.rate));
    provTax = d.basic-d.reduction;
  }
  provTax = r2(provTax);
  return {sal,isQC,pen,pen2,ei,qpip,fedTax,provTax,fedTaxable,provTaxable,fedBasic,abatement,d};
}

/* ===================== DONUT ===================== */
const CX=150, CY=150, RO=140, RI=96;
function arc(a0,a1){
  const big = (a1-a0)>Math.PI?1:0;
  const p = (r,a)=>[CX+r*Math.sin(a), CY-r*Math.cos(a)];
  const [x0,y0]=p(RO,a0),[x1,y1]=p(RO,a1),[x2,y2]=p(RI,a1),[x3,y3]=p(RI,a0);
  return `M${x0},${y0}A${RO},${RO} 0 ${big} 1 ${x1},${y1}L${x2},${y2}A${RI},${RI} 0 ${big} 0 ${x3},${y3}Z`;
}

/* ===================== RENDER ===================== */
let prov='QC';
const $ = id => document.getElementById(id);

function applyLang(){
  const t=T();
  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent = t[el.dataset.i]; });
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===lang));
  $('svg').setAttribute('aria-label', t.chartAria);
  const s=num($('sal').value); $('sal').value = s ? s.toLocaleString(t.locale) : '';
}

const PROVS=['BC','ON','QC'], PCOL={BC:'--s1',ON:'--s2',QC:'--s3'};

function syncLinks(){
  const s=num(document.getElementById('sal').value);
  const q='?'+new URLSearchParams({salary:String(s||''),lang}).toString();
  [['navHome','index.html'],['navEe','employee.html'],['navEr','employer.html']].forEach(([id,f])=>{ const a=document.getElementById(id); if(a) a.href=f+q; });
}
(function(){ try{ const v=new URLSearchParams(location.search).get('salary'); const n=parseFloat(v); if(isFinite(n)&&n>=0) document.getElementById('sal').value=String(n); }catch(e){} })();
function render(){
  syncLinks();
  const all = prov==='ALL';
  $('cmpView').hidden = !all; $('singleView').hidden = all; $('refBlock').hidden = all;
  if(all){ renderCompare(); return; }
  renderSingle();
}
function renderCompare(){
  const t=T(), sal=num($('sal').value);
  const res={}; PROVS.forEach(p=>res[p]=calc(sal,p));
  const tot=p=>res[p].fedTax+res[p].provTax+res[p].pen+res[p].pen2+res[p].ei+res[p].qpip;
  const rows=[
    ['fed',p=>res[p].fedTax],['prov',p=>res[p].provTax],['pen',p=>res[p].pen],['pen2',p=>res[p].pen2],
    ['ei',p=>res[p].ei],['qpip',p=>res[p].isQC?res[p].qpip:null],['tot',tot],['net',p=>sal-tot(p)]
  ];
  $('cmpLegend').innerHTML = PROVS.map(p=>`<span><span class="sw" style="background:var(${PCOL[p]})"></span>${t.prov[p]}</span>`).join('')
    + `<span style="color:var(--muted)">${t.cmpNote}</span>`;
  let m='';
  for(const [k,f] of rows){
    const vals=PROVS.map(f), max=Math.max(...vals.map(v=>v||0));
    m += `<div class="panel${k==='tot'||k==='net'?' key':''}"><h3>${t.cmp[k]}</h3>`;
    PROVS.forEach((p,i)=>{
      const v=vals[i], w = v&&max>0 ? v/max*100 : 0;
      m += `<div class="bar-row" data-p="${p}" data-k="${k}"><span class="pl">${p}</span><div class="bar-track"><div class="bar" style="width:${w}%;${w>0?'min-width:2px;':'display:none;'}background:var(${PCOL[p]})"></div></div><span class="val${v==null?' na':''}">${v==null?t.na:fmt(v)}</span></div>`;
    });
    m += `</div>`;
  }
  $('multiples').innerHTML=m;

  let h=`<thead><tr><th>${t.colItem}</th>${PROVS.map(p=>`<th><span class="sw" style="background:var(${PCOL[p]})"></span>${p}</th>`).join('')}</tr></thead><tbody>`;
  for(const [k,f] of rows){
    const vals=PROVS.map(f), real=vals.filter(v=>v!=null);
    const best = k==='qpip' ? null : (k==='net'?Math.max(...real):Math.min(...real));
    const allEq = real.every(v=>Math.abs(v-real[0])<.005);
    const cls = k==='tot'?' class="tot"':(k==='net'?' class="net"':'');
    h+=`<tr${cls}><td>${t.cmp[k]}</td>${vals.map(v=>`<td class="${(!allEq&&v!=null&&best!=null&&Math.abs(v-best)<.005)?'best':''}">${v==null?t.na:fmt(v)}</td>`).join('')}</tr>`;
    if(k==='net') h+=`<tr><td style="color:var(--muted)">${t.colPct}</td>${PROVS.map(p=>`<td style="color:var(--muted)">${sal>0?pct(tot(p)/sal):'—'}</td>`).join('')}</tr>`;
  }
  $('tCmp').innerHTML=h+'</tbody>';

  const notes=[t.bestNote,...t.notes,t.noteON,`<span class="warn">${t.noteBC}</span>`];
  $('notes').innerHTML = notes.map(x=>`<li>${x}</li>`).join('');

  const mult=$('multiples'), tip=$('tip2'), view=$('cmpView');
  mult.querySelectorAll('.bar-row').forEach(r=>{
    r.onmousemove=e=>{
      mult.classList.add('hovering');
      mult.querySelectorAll('.bar-row').forEach(x=>x.classList.toggle('hl',x.dataset.p===r.dataset.p));
      const b=view.getBoundingClientRect();
      tip.innerHTML=`<b>${t.prov[r.dataset.p]}</b>${t.cmp[r.dataset.k]} · ${r.querySelector('.val').textContent}`;
      tip.style.display='block';
      let x=e.clientX-b.left+12; if(x+tip.offsetWidth>b.width) x=e.clientX-b.left-tip.offsetWidth-12;
      tip.style.left=x+'px'; tip.style.top=(e.clientY-b.top+14)+'px';
    };
    r.onmouseleave=()=>{ mult.classList.remove('hovering'); mult.querySelectorAll('.bar-row').forEach(x=>x.classList.remove('hl')); tip.style.display='none'; };
  });
}
function renderSingle(){
  const t=T();
  const sal = num($('sal').value);
  const res = calc(sal, prov);
  const isQC = res.isQC, P = isQC?R.qpp:R.cpp, E = isQC?R.eiQC:R.ei;
  const pName = t.prov[prov];

  let provNote = t.nTaxable(fmt(res.provTaxable));
  if(prov==='ON') provNote += ' · ' + t.nON(fmt(res.d.basic),fmt(res.d.surtax),fmt(res.d.reduction),fmt(res.d.ohp));
  if(prov==='BC') provNote += ' · ' + t.nBC(fmt(res.d.basic),fmt(res.d.reduction));
  if(prov==='QC') provNote += ' · ' + t.nQC(fmt(res.d.wd));

  const items = [
    {k:'fed', c:'--s1', name:t.fed, v:res.fedTax, note: isQC ? t.nQcFed(fmt(res.fedBasic),fmt(res.abatement)) : t.nTaxable(fmt(res.fedTaxable))},
    {k:'prov', c:'--s2', name:t.provTax(pName), v:res.provTax, note:provNote},
    {k:'pen', c:'--s3', name:t.pen[isQC?'QPP':'CPP'], v:res.pen, note:t.nPen(pct(P.rate),fmt0(P.ympe),fmt0(P.exempt))},
    {k:'pen2', c:'--s4', name:t.pen2[isQC?'QPP2':'CPP2'], v:res.pen2, note:t.nPen2(fmt0(P.ympe),fmt0(P.yampe))},
    {k:'ei', c:'--s5', name:t.ei, v:res.ei, note:t.nEI(pct(E.rate),fmt0(E.mie),isQC)},
  ];
  if(isQC) items.push({k:'qpip', c:'--s6', name:t.qpip, v:res.qpip, note:t.nQPIP(pct(R.qpip.rate,3),fmt0(R.qpip.mie))});
  const tot = items.reduce((a,b)=>a+b.v,0);
  const net = sal-tot;
  const slices = [...items, {k:'net', c:'--net', name:t.net, v:Math.max(0,net)}];

  let svg='';
  if(sal>0){
    let a=0;
    for(const s of slices){
      if(s.v<=0) continue;
      let a1 = a + s.v/sal*2*Math.PI;
      if(a1-a>=2*Math.PI-1e-6) a1 = a+2*Math.PI-1e-4;
      svg += `<path data-k="${s.k}" d="${arc(a,a1)}" style="fill:var(${s.c})"></path>`;
      a = a1;
    }
  } else {
    svg = `<circle cx="${CX}" cy="${CY}" r="${(RO+RI)/2}" fill="none" stroke="var(--line)" stroke-width="${RO-RI}"></circle>`;
  }
  $('svg').innerHTML = svg;
  $('center').innerHTML = `<div class="l">${t.centerLabel}</div><div class="v">${fmt(tot)}</div><div class="s">${sal>0?t.ofSalary(pct(tot/sal)):''}</div>`;

  let h = `<thead><tr><th>${t.colItem}</th><th>${t.colAmount}</th><th>${t.colPct}</th></tr></thead><tbody>`;
  for(const s of items){
    h += `<tr data-k="${s.k}"><td><span class="sw" style="background:var(${s.c})"></span>${s.name}<span class="n">${s.note}</span></td><td>${fmt(s.v)}</td><td>${sal>0?pct(s.v/sal):'—'}</td></tr>`;
  }
  h += `<tr class="tot"><td>${t.total}</td><td>${fmt(tot)}</td><td>${sal>0?pct(tot/sal):'—'}</td></tr>`;
  h += `<tr class="net" data-k="net"><td><span class="sw" style="background:var(--net)"></span>${t.net}</td><td>${fmt(net)}</td><td>${sal>0?pct(net/sal):'—'}</td></tr>`;
  const mFed = marginal(res.fedTaxable,R.fed.brackets)*(isQC?1-R.fed.qcAbatement:1);
  const mProv = marginal(res.provTaxable,R[prov].brackets);
  h += `<tr><td style="color:var(--muted)">${t.effMarg}</td><td>${sal>0?pct((res.fedTax+res.provTax)/sal):'—'}</td><td>${pct(mFed+mProv)}</td></tr></tbody>`;
  $('tbl').innerHTML = h;

  bindHover(slices, sal);
  renderRef();
}

function bindHover(slices, sal){
  const chart=$('chart'), tip=$('tip');
  const set = k => {
    chart.classList.toggle('hovering', !!k);
    document.querySelectorAll('#svg path').forEach(p=>p.classList.toggle('hl', p.dataset.k===k));
    document.querySelectorAll('#tbl tr[data-k]').forEach(r=>r.classList.toggle('hl', r.dataset.k===k));
  };
  document.querySelectorAll('#svg path').forEach(p=>{
    const s = slices.find(x=>x.k===p.dataset.k);
    p.onmousemove = e=>{
      set(s.k);
      const b = chart.getBoundingClientRect();
      tip.innerHTML = `<b>${s.name}</b>${fmt(s.v)} · ${pct(s.v/sal)}`;
      tip.style.display='block';
      let x = e.clientX-b.left+12, y = e.clientY-b.top+12;
      if(x+tip.offsetWidth>b.width) x = e.clientX-b.left-tip.offsetWidth-12;
      tip.style.left=x+'px'; tip.style.top=y+'px';
    };
    p.onmouseleave = ()=>{ set(null); tip.style.display='none'; };
  });
  document.querySelectorAll('#tbl tr[data-k]').forEach(r=>{
    r.onmouseenter = ()=>set(r.dataset.k);
    r.onmouseleave = ()=>set(null);
  });
}

function renderRef(){
  const t=T(), S=R[prov], isQC=prov==='QC', P=isQC?R.qpp:R.cpp, E=isQC?R.eiQC:R.ei;
  $('refTag').textContent = '· '+t.prov[prov];
  const br = b=>{ let lo=0; return b.map(([hi,r])=>{ const s=`${pct(r)} : ${fmt0(lo)} – ${hi===Infinity?t.above:fmt0(hi)}`; lo=hi; return s; }).join('<br>'); };
  let h = `<thead><tr>${t.refCols.map((c,i)=>`<th style="text-align:left">${c}</th>`).join('')}</tr></thead><tbody>`;
  h += `<tr><td>${t.fedTaxRow}</td><td>${br(R.fed.brackets)}</td><td>${t.rFed(isQC)}</td></tr>`;
  h += `<tr><td>${t.provTaxRow(t.prov[prov])}</td><td>${br(S.brackets)}</td><td>${t.rProv[prov]}</td></tr>`;
  h += `<tr><td>${t.pen[isQC?'QPP':'CPP']}</td><td>${pct(P.rate)}</td><td>${t.rPen(fmt0(P.exempt),fmt0(P.ympe),fmt((P.ympe-P.exempt)*P.rate))}</td></tr>`;
  h += `<tr><td>${t.pen2[isQC?'QPP2':'CPP2']}</td><td>${pct(.04)}</td><td>${t.rPen2(fmt0(P.ympe),fmt0(P.yampe))}</td></tr>`;
  h += `<tr><td>${t.ei}</td><td>${pct(E.rate)}</td><td>${t.rCap(fmt0(E.mie),fmt(E.mie*E.rate))}</td></tr>`;
  if(isQC) h += `<tr><td>${t.qpip}</td><td>${pct(R.qpip.rate,3)}</td><td>${t.rCap(fmt0(R.qpip.mie),fmt(R.qpip.mie*R.qpip.rate))}</td></tr>`;
  $('tRef').innerHTML = h+'</tbody>';

  const notes=[...t.notes];
  if(prov==='ON') notes.push(t.noteON);
  if(prov==='BC') notes.push(`<span class="warn">${t.noteBC}</span>`);
  $('notes').innerHTML = notes.map(x=>`<li>${x}</li>`).join('');
}

/* ===================== EVENTS ===================== */
$('lang').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  lang=b.dataset.l;
  try{ localStorage.setItem('payroll26-lang', lang); }catch(err){}
  applyLang(); render();
});
$('prov').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  prov=b.dataset.p;
  document.querySelectorAll('#prov button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
$('sal').addEventListener('input', render);
$('sal').addEventListener('blur', ()=>{ if($('sal').value!=='') $('sal').value=num($('sal').value).toLocaleString(T().locale); });
applyLang(); render();
</script>
