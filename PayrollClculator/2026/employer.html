<!doctype html>
<html lang="en">

<title>Employer Cost 2026</title>
<style>
:root{
  color-scheme:light;
  --bg-grad:linear-gradient(135deg,#eef3fb 0%,#f6f1fb 45%,#fdf3ec 100%);
  --card-grad:linear-gradient(160deg,rgba(255,255,255,.96) 0%,rgba(246,249,255,.92) 55%,rgba(250,245,255,.9) 100%);
  --card-border:rgba(42,120,214,.14);
  --ink:#0b0b0b;--muted:#52514e;--line:rgba(20,30,50,.10);--accent:#2a78d6;
  --btn-grad:linear-gradient(135deg,#2a78d6,#6250d6);
  --input-bg:rgba(255,255,255,.85);
  --shadow:0 8px 30px rgba(40,60,120,.08);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--net:#d4d6d9;
  --warn:#a15c00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg-grad:linear-gradient(135deg,#0f1420 0%,#16121f 50%,#1d1512 100%);
    --card-grad:linear-gradient(160deg,rgba(30,34,44,.95) 0%,rgba(26,28,38,.93) 55%,rgba(32,26,40,.92) 100%);
    --card-border:rgba(120,150,230,.16);
    --ink:#f0efec;--muted:#c3c2b7;--line:rgba(255,255,255,.09);--accent:#3987e5;
    --btn-grad:linear-gradient(135deg,#3987e5,#9085e9);
    --input-bg:rgba(0,0,0,.25);
    --shadow:0 8px 30px rgba(0,0,0,.35);
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--net:#3a3a38;
    --warn:#e0a55a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-grad:linear-gradient(135deg,#0f1420 0%,#16121f 50%,#1d1512 100%);
  --card-grad:linear-gradient(160deg,rgba(30,34,44,.95) 0%,rgba(26,28,38,.93) 55%,rgba(32,26,40,.92) 100%);
  --card-border:rgba(120,150,230,.16);
  --ink:#f0efec;--muted:#c3c2b7;--line:rgba(255,255,255,.09);--accent:#3987e5;
  --btn-grad:linear-gradient(135deg,#3987e5,#9085e9);
  --input-bg:rgba(0,0,0,.25);
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--net:#3a3a38;
  --warn:#e0a55a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;background:var(--bg-grad);background-attachment:fixed}
body{margin:0;min-height:100vh;background:var(--bg-grad);background-attachment:fixed;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.ver{font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--card-border);border-radius:999px;background:var(--card-grad)}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--card-grad);border:1px solid var(--card-border);box-shadow:var(--shadow)}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500}
.lang button.on{background:var(--btn-grad);color:#fff}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card-grad);border:1px solid var(--card-border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg);color:var(--ink);font-size:16px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.prov{display:flex;gap:6px}
.prov button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--input-bg);color:var(--ink);border-radius:8px;cursor:pointer;font-size:14px}
.prov button.on{background:var(--btn-grad);border-color:transparent;color:#fff}
.main{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:center;margin-top:16px}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.chart{position:relative;width:100%;max-width:300px;margin:0 auto}
.chart svg{display:block;width:100%;height:auto}
.chart path{cursor:pointer;stroke:var(--input-bg);stroke-width:2;transition:opacity .15s}
.chart.hovering path:not(.hl){opacity:.35}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 70px}
.center .l{font-size:12px;color:var(--muted)}
.center .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.center .s{font-size:12px;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--card-grad);border:1px solid var(--card-border);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;display:none;z-index:2;backdrop-filter:blur(6px)}
.tip b{display:block;font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
td .n{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-left:18px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:baseline}
tbody tr.hl td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:none}
tr.net td{font-weight:600;border-bottom:none}
.tbl-scroll{overflow-x:auto}
h2{font-size:15px;margin:0 0 10px}
.ref{margin-top:16px}
.ref td,.ref th{font-size:13px}
.ref td:nth-child(2){white-space:nowrap;text-align:left}
.ref td:nth-child(3){text-align:left}
.notes{color:var(--muted);font-size:12.5px;margin:14px 0 0;padding-left:18px}
.notes li{margin:3px 0}
.warn{color:var(--warn)}
.prov button.cmp{flex:1.8;white-space:nowrap;padding:9px 8px}
#cmpView{position:relative;margin-top:18px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.legend span{display:inline-flex;align-items:center}
.multiples{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.panel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--input-bg)}
.panel h3{font-size:13px;font-weight:600;margin:0 0 10px}
.panel.key{border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.bar-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;height:26px;cursor:default}
.bar-row .pl{font-size:12px;color:var(--muted);font-weight:500}
.bar-track{position:relative;height:14px}
.bar{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;transition:width .25s,opacity .15s}
.bar-row .val{font-size:12.5px;font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
.bar-row .val.na{color:var(--muted)}
.multiples.hovering .bar-row:not(.hl) .bar{opacity:.35}
.cmp-tbl td.best{font-weight:600}
.cmp-tbl td.best::after{content:" ✓";color:var(--muted)}
.cmp-tbl td,.cmp-tbl th{white-space:nowrap}

<style>
.topbar{justify-content:space-between!important;align-items:center;gap:12px}
.ver{font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--card-border);border-radius:999px;background:var(--card-grad)}
.wcb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;align-items:end}
@media (max-width:640px){.wcb{grid-template-columns:1fr 1fr}}
:root{--s7:#6250d6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s7:#9085e9}}
:root[data-theme="dark"]{--s7:#9085e9}
.wcb .hint{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.unit{position:relative}
.unit input,.unit select{padding-right:64px}
select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg);color:var(--ink);font-size:16px;appearance:none;-webkit-appearance:none;cursor:pointer}
select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input.fixed{color:var(--muted);cursor:default;background:transparent}
input.fixed:focus{outline:none}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}

.topbar{flex-wrap:wrap}
.navwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.home:hover{color:var(--accent)}
.home::before{content:"← ";color:var(--muted)}
.nav{display:inline-flex;padding:3px;border-radius:999px;background:var(--card-grad);border:1px solid var(--card-border);box-shadow:var(--shadow)}
.nav a{color:var(--muted);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
.nav a.on{background:var(--btn-grad);color:#fff}
.nav a:not(.on):hover{color:var(--ink)}
</style>
</head>

    </div>

    <div id="cmpView" hidden>
      <div class="legend" id="cmpLegend"></div>
      <div class="multiples" id="multiples"></div>
      <h2 style="margin-top:20px" data-i="cmpTableTitle"></h2>

      </div>
      <div class="tbl-scroll"><table id="tbl"></table></div>
    </div>
  </div>

  <div class="card ref">

      <div class="tbl-scroll"><table id="tRef"></table></div>

  </div>
</div>

function detectLang(){
  try{ const q=new URLSearchParams(location.search).get('lang'); if(I18N[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem('payroll26-lang'); if(I18N[s]) return s; }catch(e){}
  for(const l of (navigator.languages||[navigator.language||'en'])){
    const p=String(l).toLowerCase().slice(0,2);
    if(p==='zh') return 'zh'; if(p==='fr') return 'fr'; if(p==='en') return 'en';
  }
  return 'en';
}
let lang=detectLang(), prov='QC';
const T=()=>I18N[lang];

/* ===================== HELPERS ===================== */
const r2 = x => Math.round(x*100)/100;
const fmt = x => new Intl.NumberFormat(T().locale,{style:'currency',currency:'CAD',currencyDisplay:'narrowSymbol',minimumFractionDigits:2,maximumFractionDigits:2}).format(x);
const fmt0 = x => new Intl.NumberFormat(T().locale,{style:'currency',currency:'CAD',currencyDisplay:'narrowSymbol',maximumFractionDigits:0}).format(x);
const pct = (x,d=2) => new Intl.NumberFormat(T().locale,{style:'percent',maximumFractionDigits:d}).format(x);
const dec = x => new Intl.NumberFormat(T().locale,{style:'currency',currency:'CAD',currencyDisplay:'narrowSymbol',minimumFractionDigits:2,maximumFractionDigits:4}).format(x);
const num = s => { const v=parseFloat(String(s).replace(/\s| | /g,'').replace(/[^0-9.,\-]/g,'').replace(/,(?=\d{1,2}$)/,'.').replace(/,/g,'')); return isFinite(v)?v:0; };
const numRate = s => { const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.').replace(/[^0-9.\-]/g,'')); return isFinite(v)&&v>=0?v:0; };
const $ = id => document.getElementById(id);
const wcbRate = p => p==='ON' ? 0.32 : Number($('wcb'+p).value);

/* ===================== CALC ===================== */
function calc(sal, p){
  const isQC=p==='QC', P=isQC?R.qpp:R.cpp, E=isQC?R.eiQC:R.ei, W=R.wcb[p];
  const pen = r2(Math.max(0,Math.min(sal,P.ympe)-P.exempt)*P.rate);
  const pen2 = r2(Math.max(0,Math.min(sal,P.yampe)-P.ympe)*P.r2);
  const ei = r2(r2(Math.min(sal,E.mie)*E.rate)*E.mult);
  const qpip = isQC ? r2(Math.min(sal,R.qpip.mie)*R.qpip.er) : null;
  const wcb = r2(Math.min(sal,W.max)*wcbRate(p)/100);
  const hsf = r2(sal*(isQC?R.hsf:R.eht));
  const cnt = isQC ? r2(Math.min(sal,R.cnt.max)*R.cnt.rate) : null;
  const er = pen+pen2+ei+(qpip||0)+wcb+hsf+(cnt||0);
  return {sal,isQC,pen,pen2,ei,qpip,wcb,hsf,cnt,er,total:sal+er};
}

/* ===================== DONUT ===================== */
const CX=150, CY=150, RO=140, RI=96;
function arc(a0,a1){
  const big=(a1-a0)>Math.PI?1:0, p=(r,a)=>[CX+r*Math.sin(a),CY-r*Math.cos(a)];
  const [x0,y0]=p(RO,a0),[x1,y1]=p(RO,a1),[x2,y2]=p(RI,a1),[x3,y3]=p(RI,a0);
  return `M${x0},${y0}A${RO},${RO} 0 ${big} 1 ${x1},${y1}L${x2},${y2}A${RI},${RI} 0 ${big} 0 ${x3},${y3}Z`;
}

/* ===================== RENDER ===================== */
function applyLang(){
  const t=T();
  document.documentElement.lang=t.htmlLang; document.title=t.docTitle;
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t[el.dataset.i]; });
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  $('svg').setAttribute('aria-label',t.chartAria);
  const s=num($('sal').value); $('sal').value = s ? s.toLocaleString(t.locale) : '';
  $('hsfQC').value = pct(R.hsf); $('ehtONBC').value = pct(R.eht); $('cntQC').value = pct(R.cnt.rate);
  $('wcbON').value = (0.32).toLocaleString(t.locale,{minimumFractionDigits:2});
  [...$('wcbBC').options,...$('wcbQC').options].forEach(o=>o.textContent=Number(o.value).toLocaleString(t.locale,{minimumFractionDigits:2}));
}

function syncLinks(){
  const s=num(document.getElementById('sal').value);
  const q='?'+new URLSearchParams({salary:String(s||''),lang}).toString();
  [['navHome','index.html'],['navEe','employee.html'],['navEr','employer.html']].forEach(([id,f])=>{ const a=document.getElementById(id); if(a) a.href=f+q; });
}
(function(){ try{ const v=new URLSearchParams(location.search).get('salary'); const n=parseFloat(v); if(isFinite(n)&&n>=0) document.getElementById('sal').value=String(n); }catch(e){} })();
function render(){
  syncLinks();
  const all=prov==='ALL';
  $('cmpView').hidden=!all; $('singleView').hidden=all;
  all ? renderCompare() : renderSingle();
  renderRef();
}
function renderSingle(){
  const t=T(), sal=num($('sal').value), res=calc(sal,prov);
  const isQC=res.isQC, P=isQC?R.qpp:R.cpp, E=isQC?R.eiQC:R.ei, W=R.wcb[prov];
  const items=[
    {k:'pen',c:'--s1',name:t.pen[isQC?'QPP':'CPP'],v:res.pen,note:t.nPen(pct(P.rate),fmt0(P.ympe),fmt0(P.exempt))},
    {k:'pen2',c:'--s2',name:t.pen2[isQC?'QPP2':'CPP2'],v:res.pen2,note:t.nPen2(fmt0(P.ympe),fmt0(P.yampe))},
    {k:'ei',c:'--s3',name:t.ei,v:res.ei,note:t.nEI(pct(E.rate*E.mult,3),fmt0(E.mie))},
  ];
  if(isQC) items.push({k:'qpip',c:'--s4',name:t.qpip,v:res.qpip,note:t.nQPIP(pct(R.qpip.er,3),fmt0(R.qpip.mie))});
  items.push({k:'wcb',c:'--s5',name:t.wcb[prov],v:res.wcb,note:t.nWCB(dec(wcbRate(prov)),fmt0(W.max))});
  items.push({k:'hsf',c:'--s6',name:t.health[prov],v:res.hsf,note:t.nHSF(pct(isQC?R.hsf:R.eht))});
  if(isQC) items.push({k:'cnt',c:'--s7',name:t.cnt,v:res.cnt,note:t.nCNT(pct(R.cnt.rate),fmt0(R.cnt.max))});
  const total=res.total;
  const slices=[{k:'sal',c:'--net',name:t.salaryRow,v:sal},...items];

  let svg='';
  if(total>0){
    let a=0;
    for(const s of slices){
      if(s.v<=0) continue;
      let a1=a+s.v/total*2*Math.PI;
      if(a1-a>=2*Math.PI-1e-6) a1=a+2*Math.PI-1e-4;
      svg+=`<path data-k="${s.k}" d="${arc(a,a1)}" style="fill:var(${s.c})"></path>`; a=a1;
    }
  } else svg=`<circle cx="${CX}" cy="${CY}" r="${(RO+RI)/2}" fill="none" stroke="var(--line)" stroke-width="${RO-RI}"></circle>`;
  $('svg').innerHTML=svg;
  $('center').innerHTML=`<div class="l">${t.centerLabel}</div><div class="v">${fmt(total)}</div><div class="s">${sal>0?t.overSalary(pct(res.er/sal)):''}</div>`;

  const pc=v=>total>0?pct(v/total):'—';
  let h=`<thead><tr><th>${t.colItem}</th><th>${t.colAmount}</th><th>${t.colPct}</th></tr></thead><tbody>`;
  h+=`<tr data-k="sal"><td><span class="sw" style="background:var(--net)"></span>${t.salaryRow}</td><td>${fmt(sal)}</td><td>${pc(sal)}</td></tr>`;
  for(const s of items) h+=`<tr data-k="${s.k}"><td><span class="sw" style="background:var(${s.c})"></span>${s.name}<span class="n">${s.note}</span></td><td>${fmt(s.v)}</td><td>${pc(s.v)}</td></tr>`;
  h+=`<tr class="tot"><td>${t.erTotal}</td><td>${fmt(res.er)}</td><td>${pc(res.er)}</td></tr>`;
  h+=`<tr class="net"><td>${t.total}</td><td>${fmt(total)}</td><td>${total>0?pct(1):'—'}</td></tr>`;
  h+=`<tr><td style="color:var(--muted)">${t.loadRow}</td><td></td><td>${sal>0?pct(res.er/sal):'—'}</td></tr></tbody>`;
  $('tbl').innerHTML=h;
  bindHover(slices,total);

  $('notes').innerHTML=t.notes.map(x=>`<li>${x}</li>`).join('');
}
function bindHover(slices,total){
  const chart=$('chart'), tip=$('tip');
  const set=k=>{
    chart.classList.toggle('hovering',!!k);
    document.querySelectorAll('#svg path').forEach(p=>p.classList.toggle('hl',p.dataset.k===k));
    document.querySelectorAll('#tbl tr[data-k]').forEach(r=>r.classList.toggle('hl',r.dataset.k===k));
  };
  document.querySelectorAll('#svg path').forEach(p=>{
    const s=slices.find(x=>x.k===p.dataset.k);
    p.onmousemove=e=>{
      set(s.k);
      const b=chart.getBoundingClientRect();
      tip.innerHTML=`<b>${s.name}</b>${fmt(s.v)} · ${pct(s.v/total)}`;
      tip.style.display='block';
      let x=e.clientX-b.left+12; if(x+tip.offsetWidth>b.width) x=e.clientX-b.left-tip.offsetWidth-12;
      tip.style.left=x+'px'; tip.style.top=(e.clientY-b.top+12)+'px';
    };
    p.onmouseleave=()=>{ set(null); tip.style.display='none'; };
  });
  document.querySelectorAll('#tbl tr[data-k]').forEach(r=>{ r.onmouseenter=()=>set(r.dataset.k); r.onmouseleave=()=>set(null); });
}
function renderCompare(){
  const t=T(), sal=num($('sal').value), res={}; PROVS.forEach(p=>res[p]=calc(sal,p));
  const rows=[['pen',p=>res[p].pen],['pen2',p=>res[p].pen2],['ei',p=>res[p].ei],['qpip',p=>res[p].qpip],['wcb',p=>res[p].wcb],['hsf',p=>res[p].hsf],['cnt',p=>res[p].cnt],['er',p=>res[p].er],['total',p=>res[p].total]];
  $('cmpLegend').innerHTML=PROVS.map(p=>`<span><span class="sw" style="background:var(${PCOL[p]})"></span>${t.prov[p]}</span>`).join('')+`<span style="color:var(--muted)">${t.cmpNote}</span>`;
  let m='';
  for(const [k,f] of rows){
    const vals=PROVS.map(f), max=Math.max(...vals.map(v=>v||0));
    m+=`<div class="panel${k==='er'||k==='total'?' key':''}"><h3>${t.cmp[k]}</h3>`;
    PROVS.forEach((p,i)=>{
      const v=vals[i], w=v&&max>0?v/max*100:0;
      m+=`<div class="bar-row" data-p="${p}" data-k="${k}"><span class="pl">${p}</span><div class="bar-track"><div class="bar" style="width:${w}%;${w>0?'min-width:2px;':'display:none;'}background:var(${PCOL[p]})"></div></div><span class="val${v==null?' na':''}">${v==null?t.na:fmt(v)}</span></div>`;
    });
    m+='</div>';
  }
  $('multiples').innerHTML=m;

  let h=`<thead><tr><th>${t.colItem}</th>${PROVS.map(p=>`<th><span class="sw" style="background:var(${PCOL[p]})"></span>${p}</th>`).join('')}</tr></thead><tbody>`;
  h+=`<tr><td>${t.salaryRow}</td>${PROVS.map(()=>`<td>${fmt(sal)}</td>`).join('')}</tr>`;
  for(const [k,f] of rows){
    const vals=PROVS.map(f), real=vals.filter(v=>v!=null), best=(k==='qpip'||k==='cnt')?null:Math.min(...real);
    const allEq=real.every(v=>Math.abs(v-real[0])<.005);
    const cls=k==='er'?' class="tot"':(k==='total'?' class="net"':'');
    h+=`<tr${cls}><td>${t.cmp[k]}</td>${vals.map(v=>`<td class="${(!allEq&&v!=null&&best!=null&&Math.abs(v-best)<.005)?'best':''}">${v==null?t.na:fmt(v)}</td>`).join('')}</tr>`;
  }
  h+=`<tr><td style="color:var(--muted)">${t.loadRow}</td>${PROVS.map(p=>`<td style="color:var(--muted)">${sal>0?pct(res[p].er/sal):'—'}</td>`).join('')}</tr>`;
  $('tCmp').innerHTML=h+'</tbody>';
  $('notes').innerHTML=[t.bestNote,...t.notes].map(x=>`<li>${x}</li>`).join('');

  const mult=$('multiples'), tip=$('tip2'), view=$('cmpView');
  mult.querySelectorAll('.bar-row').forEach(r=>{
    r.onmousemove=e=>{
      mult.classList.add('hovering');
      mult.querySelectorAll('.bar-row').forEach(x=>x.classList.toggle('hl',x.dataset.p===r.dataset.p));
      const b=view.getBoundingClientRect();
      tip.innerHTML=`<b>${t.prov[r.dataset.p]}</b>${t.cmp[r.dataset.k]} · ${r.querySelector('.val').textContent}`;
      tip.style.display='block';
      let x=e.clientX-b.left+12; if(x+tip.offsetWidth>b.width) x=e.clientX-b.left-tip.offsetWidth-12;
      tip.style.left=x+'px'; tip.style.top=(e.clientY-b.top+14)+'px';
    };
    r.onmouseleave=()=>{ mult.classList.remove('hovering'); mult.querySelectorAll('.bar-row').forEach(x=>x.classList.remove('hl')); tip.style.display='none'; };
  });
}
function renderRef(){
  const t=T(), order=['ON','BC','QC'];
  const cell=p=>{ const isQC=p==='QC', P=isQC?R.qpp:R.cpp, E=isQC?R.eiQC:R.ei, W=R.wcb[p];
    return {pen:`${pct(P.rate)} · ${fmt0(P.exempt)}–${fmt0(P.ympe)}`, pen2:`4% · ${fmt0(P.ympe)}–${fmt0(P.yampe)}`,
      ei:`${pct(E.rate*E.mult,3)} · ${t.ref.max} ${fmt0(E.mie)}`, qpip:isQC?`${pct(R.qpip.er,3)} · ${t.ref.max} ${fmt0(R.qpip.mie)}`:t.na,
      wcb:`${dec(wcbRate(p))} / $100 · ${t.ref.max} ${fmt0(W.max)}`, hsf:`${pct(isQC?R.hsf:R.eht)} · ${t.ref.noMax}`, cnt:isQC?`${pct(R.cnt.rate)} · ${t.ref.max} ${fmt0(R.cnt.max)}`:t.na}; };
  const c={}; order.forEach(p=>c[p]=cell(p));
  let h=`<thead><tr>${t.refCols.map(x=>`<th style="text-align:left">${x}</th>`).join('')}</tr></thead><tbody>`;
  for(const k of ['pen','pen2','ei','qpip','wcb','hsf','cnt']) h+=`<tr><td>${t.ref[k]}</td>${order.map(p=>`<td style="text-align:left;white-space:nowrap">${c[p][k]}</td>`).join('')}</tr>`;
  $('tRef').innerHTML=h+'</tbody>';
}

/* ===================== EVENTS ===================== */
$('lang').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; lang=b.dataset.l; try{localStorage.setItem('payroll26-lang',lang);}catch(err){} applyLang(); render(); });
$('prov').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; prov=b.dataset.p; document.querySelectorAll('#prov button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
$('sal').addEventListener('input',render);
['wcbBC','wcbQC'].forEach(id=>$(id).addEventListener('change',render));
$('sal').addEventListener('blur',()=>{ if($('sal').value!=='') $('sal').value=num($('sal').value).toLocaleString(T().locale); });
applyLang(); render();
</script>
