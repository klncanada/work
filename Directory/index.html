<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Contact Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        (() => {
            const hour = new Date().getHours();
            const automaticTheme = hour >= 19 || hour < 7 ? 'dark' : 'light';
            try {
                const savedMode = localStorage.getItem('kln-portal-theme-mode');
                const mode = ['auto', 'light', 'dark'].includes(savedMode) ? savedMode : 'auto';
                document.documentElement.dataset.theme = mode === 'auto' ? automaticTheme : mode;
            } catch (error) {
                document.documentElement.dataset.theme = automaticTheme;
            }
        })();
    </script>
    <style>
        :root { --page-bg: #f4f7f6; --text: #1f2937; --muted: #6b7280; --line: #e5e7eb; --panel: #ffffff; --topbar-bg: rgba(255,255,255,.82); --topbar-border: rgba(219,227,240,.9); --switcher-bg: #f3f6fc; --active-control-bg: #ffffff; --brand: #2563eb; }
        html[data-theme="dark"] { color-scheme: dark; --page-bg: #07111f; --text: #e5eefc; --muted: #9babc1; --line: #29415f; --panel: #0f1b2d; --topbar-bg: rgba(7,17,31,.86); --topbar-border: rgba(41,65,95,.9); --switcher-bg: #101f33; --active-control-bg: #1b304a; --brand: #60a5fa; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--page-bg); color: var(--text); transition: background-color .25s ease, color .25s ease; }
        .portal-topbar { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(10px); background: var(--topbar-bg); border-bottom: 1px solid var(--topbar-border); }
        .portal-topbar-inner { width: min(calc(100% - 32px), 1280px); min-height: 72px; margin: 0 auto; padding: 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .portal-brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: inherit; text-decoration: none; }
        .portal-brand-logo { width: 100px; height: 46px; padding: 3px 0; object-fit: contain; flex: 0 0 auto; }
        .portal-brand h1 { margin: 0; font-size: 1.1rem; line-height: 1.2; }
        .portal-brand p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
        .portal-theme-switcher { display: inline-flex; gap: 6px; background: var(--switcher-bg); padding: 6px; border: 1px solid var(--line); border-radius: 999px; }
        .theme-btn { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; font-size: .92rem; font-weight: 600; cursor: pointer; }
        .theme-btn.is-active { background: var(--active-control-bg); color: var(--brand); box-shadow: 0 2px 10px rgba(37,99,235,.12); }
        .theme-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
        html[data-theme="dark"] .bg-white { background-color: var(--panel) !important; }
        html[data-theme="dark"] .bg-gray-50, html[data-theme="dark"] .bg-gray-100 { background-color: #132137 !important; }
        html[data-theme="dark"] .border-gray-100, html[data-theme="dark"] .border-gray-200, html[data-theme="dark"] .border-dashed { border-color: var(--line) !important; }
        html[data-theme="dark"] .text-gray-800, html[data-theme="dark"] .text-gray-700, html[data-theme="dark"] .text-gray-900 { color: var(--text) !important; }
        html[data-theme="dark"] .text-gray-600, html[data-theme="dark"] .text-gray-500, html[data-theme="dark"] .text-gray-400, html[data-theme="dark"] .text-gray-300 { color: var(--muted) !important; }
        .checkbox-custom:checked { background-color: #3b82f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @media (max-width: 640px) { .portal-topbar-inner { align-items: flex-start; flex-wrap: wrap; } }
    </style>
</head>
<body>

    <header class="portal-topbar">
        <div class="portal-topbar-inner">
            <a class="portal-brand" href="https://tools.klncanada.com/" aria-label="Go to the KLN Employee Portal homepage">
                <img class="portal-brand-logo" src="https://img.klncanada.com/company/logo/KLN%20Logo_colour_RGB.png" alt="KLN">
                <div>
                    <h1>KLN Employee Portal</h1>
                    <p>Internal Contact Directory</p>
                </div>
            </a>
            <div class="portal-theme-switcher" role="group" aria-label="Display mode">
                <button id="themeAuto" class="theme-btn" type="button">Auto</button>
                <button id="themeLight" class="theme-btn" type="button">Light</button>
                <button id="themeDark" class="theme-btn" type="button">Dark</button>
            </div>
        </div>
    </header>

    <div class="p-4 md:p-10">
    <div class="max-w-7xl mx-auto">
        <header class="mb-6 flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-gray-200 pb-4">
            <div>
                <p id="lastUpdated" class="text-gray-400 text-[10px] mt-1 uppercase tracking-widest font-bold">Connecting to contacts.csv...</p>
            </div>
            <div class="flex items-center gap-3">
                <input type="file" id="manualFileInput" accept=".csv" class="hidden" onchange="handleManualUpload(event)">
                <button id="manualUploadBtn" onclick="document.getElementById('manualFileInput').click()" class="bg-white hover:bg-gray-50 text-blue-600 text-[10px] font-bold py-1.5 px-4 rounded-full border border-blue-200 shadow-sm transition-all uppercase tracking-wider">
                    Manual Upload
                </button>
                <div id="syncStatus" class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-[10px] font-black uppercase border border-amber-200 shadow-sm">
                    Synchronizing...
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <aside class="lg:col-span-1 flex flex-col gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-3">Department</h3>
                    <div id="deptFilters" class="space-y-1 max-h-48 overflow-y-auto custom-scrollbar pr-2 text-xs"></div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-3">Office</h3>
                    <div id="officeFilters" class="space-y-1 text-xs"></div>
                </div>

                <button onclick="resetFilters()" class="w-full py-3 text-xs font-black text-red-500 bg-red-50 hover:bg-red-100 border border-red-200 rounded-xl transition-all uppercase tracking-widest shadow-sm">
                    Clear All Filters
                </button>
            </aside>

            <main class="lg:col-span-3 space-y-4">
                <div class="relative">
                    <input type="text" id="searchBar" placeholder="Search by name, alias, office, or extension..." 
                           class="w-full pl-12 pr-6 py-4 bg-white border-none rounded-2xl shadow-sm focus:ring-2 focus:ring-blue-500 transition-all text-lg outline-none placeholder:text-gray-300">
                    <svg class="w-6 h-6 text-gray-300 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>

                <div id="resultsWrapper" class="hidden fade-in bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="min-w-full divide-y divide-gray-100">
                            <thead class="bg-gray-50 text-[10px] font-black text-gray-400 uppercase tracking-widest">
                                <tr>
                                    <th class="px-6 py-4 text-left">Employee</th>
                                    <th class="px-6 py-4 text-left">Alias</th>
                                    <th class="px-6 py-4 text-left">Office</th>
                                    <th class="px-6 py-4 text-left">Main Numbers</th>
                                    <th class="px-6 py-4 text-center">Ext</th>
                                </tr>
                            </thead>
                            <tbody id="contactList" class="divide-y divide-gray-50 text-gray-700"></tbody>
                        </table>
                    </div>
                </div>

                <div id="initialState" class="py-20 text-center bg-white rounded-2xl shadow-sm border-2 border-dashed border-gray-200">
                    <p class="text-gray-300 font-bold uppercase tracking-widest text-sm">Waiting for input to search...</p>
                </div>

                <div id="emptyState" class="hidden py-20 text-center bg-white rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-gray-400 font-bold">No matching contacts found.</p>
                </div>
            </main>
        </div>
    </div>
    </div>

    <script>
        let contacts = [];
        let selectedDepts = [];
        let selectedOffices = [];

        function processData(csvString, sourceLabelText) {
            const badge = document.getElementById('syncStatus');
            const lastUpdated = document.getElementById('lastUpdated');
            const manualBtn = document.getElementById('manualUploadBtn');

            Papa.parse(csvString, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    contacts = results.data;
                    badge.innerText = "Synchronized";
                    badge.className = "bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px] font-black uppercase border border-green-200 shadow-sm";
                    lastUpdated.innerText = sourceLabelText;
                    
                    // 核心要求：同步成功后隐藏手动按钮
                    manualBtn.classList.add('hidden');
                    
                    initFilters();
                    render();
                }
            });
        }

        async function fetchCSV() {
            const badge = document.getElementById('syncStatus');
            try {
                const csvPath = new URL('./contacts.csv', window.location.href).href;
                const response = await fetch(csvPath);
                if (!response.ok) throw new Error("Auto-load failed");
                const csvString = await response.text();
                processData(csvString, "Live Data: contacts.csv");
            } catch (err) {
                badge.innerText = "Manual Ready";
                badge.className = "bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-[10px] font-black uppercase border border-blue-200 shadow-sm";
            }
        }

        function handleManualUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                processData(e.target.result, `Manual: ${file.name}`);
            };
            reader.readAsText(file);
        }

        function initFilters() {
            const depts = [...new Set(contacts.map(c => c.Department))].filter(d => d).sort();
            const offices = [...new Set(contacts.map(c => c.Office))].filter(o => o).sort();

            document.getElementById('deptFilters').innerHTML = depts.map(dept => `
                <label class="flex items-center space-x-2 cursor-pointer group py-0.5">
                    <input type="checkbox" value="${dept}" onchange="toggleFilter('dept', '${dept}')" class="checkbox-custom w-3.5 h-3.5 border-gray-300 rounded text-blue-600 focus:ring-0">
                    <span class="text-gray-500 group-hover:text-gray-900 transition-colors">${dept}</span>
                </label>
            `).join('');

            document.getElementById('officeFilters').innerHTML = offices.map(off => `
                <label class="flex items-center space-x-2 cursor-pointer group py-0.5">
                    <input type="checkbox" value="${off}" onchange="toggleFilter('office', '${off}')" class="checkbox-custom w-3.5 h-3.5 border-gray-300 rounded text-green-600 focus:ring-0">
                    <span class="text-gray-500 group-hover:text-gray-900 transition-colors">${off}</span>
                </label>
            `).join('');
        }

        function toggleFilter(type, value) {
            const list = type === 'dept' ? selectedDepts : selectedOffices;
            const index = list.indexOf(value);
            index > -1 ? list.splice(index, 1) : list.push(value);
            render();
        }

        function resetFilters() {
            selectedDepts = []; selectedOffices = [];
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.getElementById('searchBar').value = '';
            render();
        }

        function render() {
            const search = document.getElementById('searchBar').value.toLowerCase().trim();
            const isIdle = !search && selectedDepts.length === 0 && selectedOffices.length === 0;

            if (isIdle) {
                document.getElementById('resultsWrapper').classList.add('hidden');
                document.getElementById('initialState').classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
                return;
            }

            const filtered = contacts.filter(c => {
                const text = `${c.Employee} ${c.Alias} ${c.Office} ${c.Department} ${c.Extension} ${c['Main Number']} ${c['2nd Main Number']}`.toLowerCase();
                const matchSearch = text.includes(search);
                const matchDept = selectedDepts.length === 0 || selectedDepts.includes(c.Department);
                const matchOffice = selectedOffices.length === 0 || selectedOffices.includes(c.Office);
                return matchSearch && matchDept && matchOffice;
            });

            document.getElementById('initialState').classList.add('hidden');
            if (filtered.length === 0) {
                document.getElementById('resultsWrapper').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            } else {
                document.getElementById('resultsWrapper').classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('contactList').innerHTML = filtered.map(c => {
                    const m1 = c['Main Number'] || '';
                    const m2 = c['2nd Main Number'] || '';
                    const ext = (c.Extension && c.Extension !== 'nan') ? c.Extension : '-';

                    return `
                    <tr class="hover:bg-blue-50/40 transition-colors">
                        <td class="px-6 py-3 whitespace-nowrap">
                            <div class="text-sm font-bold text-gray-800">${c.Employee}</div>
                            <div class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">${c.Department || 'N/A'}</div>
                        </td>
                        <td class="px-6 py-3 whitespace-nowrap text-sm text-blue-600 font-mono font-bold">${c.Alias || '-'}</td>
                        <td class="px-6 py-3 whitespace-nowrap text-xs text-gray-700 font-medium">${c.Office}</td>
                        <td class="px-6 py-3 whitespace-nowrap">
                            <div class="text-xs text-gray-600 font-mono">${m1}</div>
                            <div class="text-[10px] text-gray-400 font-mono italic">${m2}</div>
                        </td>
                        <td class="px-6 py-3 whitespace-nowrap text-center">
                            <span class="bg-gray-100 px-3 py-1 rounded-lg border border-gray-200 font-bold text-gray-700 text-xs">${ext}</span>
                        </td>
                    </tr>
                    `;
                }).join('');
            }
        }

        const themeStorageKey = 'kln-portal-theme-mode';
        const themeModes = ['auto', 'light', 'dark'];

        function automaticTheme() {
            const hour = new Date().getHours();
            return hour >= 19 || hour < 7 ? 'dark' : 'light';
        }

        function savedThemeMode() {
            try {
                const savedMode = localStorage.getItem(themeStorageKey);
                return themeModes.includes(savedMode) ? savedMode : 'auto';
            } catch (error) {
                return 'auto';
            }
        }

        function applyTheme(mode, shouldSave = true) {
            const selectedMode = themeModes.includes(mode) ? mode : 'auto';
            document.documentElement.dataset.themeMode = selectedMode;
            document.documentElement.dataset.theme = selectedMode === 'auto' ? automaticTheme() : selectedMode;

            ['Auto', 'Light', 'Dark'].forEach(label => {
                const button = document.getElementById(`theme${label}`);
                const isSelected = label.toLowerCase() === selectedMode;
                button.classList.toggle('is-active', isSelected);
                button.setAttribute('aria-pressed', String(isSelected));
            });

            if (shouldSave) {
                try {
                    localStorage.setItem(themeStorageKey, selectedMode);
                } catch (error) {
                    // Continue without persistence when browser storage is unavailable.
                }
            }
        }

        let currentThemeMode = savedThemeMode();
        applyTheme(currentThemeMode, false);

        ['Auto', 'Light', 'Dark'].forEach(label => {
            document.getElementById(`theme${label}`).addEventListener('click', () => {
                currentThemeMode = label.toLowerCase();
                applyTheme(currentThemeMode);
            });
        });

        setInterval(() => {
            if (currentThemeMode === 'auto') applyTheme('auto', false);
        }, 60000);

        document.getElementById('searchBar').addEventListener('input', render);
        window.onload = fetchCSV;
    </script>
</body>
</html>
