<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendrier de Stationnement</title>
  <script>
    (function () {
      const hour = new Date().getHours();
      const automaticTheme = hour >= 19 || hour < 7 ? "dark" : "light";
      try {
        const savedMode = localStorage.getItem("kln-portal-theme-mode");
        const mode = ["auto", "light", "dark"].includes(savedMode) ? savedMode : "auto";
        document.documentElement.dataset.theme = mode === "auto" ? automaticTheme : mode;
      } catch (error) {
        document.documentElement.dataset.theme = automaticTheme;
      }
    })();
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --soft: #e2e8f0;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green-bg: #dcfce7;
      --green: #15803d;
      --amber-soft: #fffbeb;
      --amber: #d97706;
      --bg-end: #eef4ff;
      --border: #dbe3f0;
      --shadow: rgba(15, 23, 42, 0.12);
      --subtle: #f7f9fc;
      --topbar-bg: rgba(255, 255, 255, 0.88);
      --topbar-border: rgba(219, 227, 240, 0.9);
      --switcher-bg: #f3f6fc;
      --active-control-bg: #ffffff;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #07111f;
      --card: #0f1b2d;
      --text: #e5eefc;
      --muted: #9fb0c8;
      --soft: #253550;
      --blue-soft: #122a52;
      --green-bg: #123625;
      --green: #67d796;
      --amber-soft: #382a10;
      --amber: #f2b84b;
      --bg-end: #0b1728;
      --border: #253550;
      --shadow: rgba(0, 0, 0, 0.34);
      --subtle: #0b1728;
      --topbar-bg: rgba(7, 17, 31, 0.88);
      --topbar-border: rgba(37, 53, 80, 0.92);
      --switcher-bg: #111f33;
      --active-control-bg: #1a2a43;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg), var(--bg-end));
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .portal-topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(10px);
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--topbar-border);
    }

    .portal-topbar-inner {
      width: min(calc(100% - 32px), 1180px);
      min-height: 72px;
      margin: 0 auto;
      padding: 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .portal-brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .portal-brand-logo {
      width: 100px;
      height: 46px;
      padding: 3px 0;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .portal-brand h1 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .portal-brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .portal-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .portal-lang-switcher,
    .portal-theme-switcher {
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      background: var(--switcher-bg);
      border: 1px solid var(--soft);
      border-radius: 999px;
    }

    .lang-btn,
    .theme-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }

    .lang-btn.active,
    .theme-btn.active {
      background: var(--active-control-bg);
      color: var(--blue);
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.12);
    }

    .lang-btn:focus-visible,
    .theme-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .page {
      min-height: 100vh;
      padding: 40px 16px 56px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 760px;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
      box-shadow: 0 24px 60px var(--shadow);
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .app-header h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 15px;
      color: var(--muted);
      font-weight: 500;
    }

    .date-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .current-card {
      background: var(--card);
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 14px 32px rgba(37, 99, 235, 0.10);
      margin-bottom: 18px;
    }

    .card-title {
      background: var(--blue);
      color: white;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 10px 16px;
      text-transform: uppercase;
    }

    .card-body {
      padding: 28px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(210px, auto);
      grid-template-rows: auto auto;
      align-items: center;
      column-gap: 20px;
      row-gap: 5px;
      text-align: left;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      background: var(--blue-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      margin: 0;
      grid-row: 1 / 3;
    }

    .holder {
      margin: 0;
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
      align-self: end;
    }

    .range {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 650;
      margin: 0;
      align-self: start;
    }

    .status-box {
      display: flex;
      justify-content: space-evenly;
      align-self: stretch;
      grid-column: 3;
      grid-row: 1 / 3;
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }

    .status-label {
      margin: 0 0 5px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .badge {
      background: var(--green-bg);
      color: var(--green);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .week-value {
      color: #334155;
      font-size: 14px;
      font-weight: 800;
    }

    .divider {
      width: 1px;
      background: var(--soft);
    }

    .next-card {
      background: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .next-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .arrow-box {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--amber-soft);
      color: var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-label {
      margin: 0 0 5px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .next-name {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #334155;
    }

    .next-date {
      text-align: right;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      color: #475569;
    }

    .schedule-section {
      border-top: 1px solid var(--soft);
      padding-top: 16px;
    }

    .toggle {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
      cursor: pointer;
    }

    .toggle-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chevron {
      transition: transform 0.25s ease;
    }

    .chevron.open {
      transform: rotate(180deg);
    }

    .table-wrap {
      margin-top: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: auto;
      max-height: 320px;
      box-shadow: inset 0 1px 4px rgba(15, 23, 42, 0.04);
      display: none;
    }

    .table-wrap.show {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    thead {
      background: var(--subtle);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th {
      color: #94a3b8;
      padding: 11px 14px;
      font-weight: 750;
      text-transform: uppercase;
    }

    td {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      font-weight: 600;
      color: #475569;
      white-space: nowrap;
    }

    tr.current {
      background: #eff6ff;
    }

    tr.current td:last-child {
      color: var(--blue);
      font-weight: 950;
    }

    .now-badge {
      margin-left: 5px;
      background: var(--blue);
      color: white;
      border-radius: 999px;
      padding: 3px 6px;
      font-size: 9px;
      font-weight: 800;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 16px;
      padding: 0 16px 4px;
      font-style: italic;
      font-weight: 500;
    }

    svg {
      display: block;
      flex-shrink: 0;
    }

    .error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 16px;
    }

    [data-theme="dark"] .date-pill,
    [data-theme="dark"] .current-card,
    [data-theme="dark"] .next-card,
    [data-theme="dark"] .table-wrap {
      background: var(--card);
      border-color: var(--soft);
    }

    [data-theme="dark"] .status-box,
    [data-theme="dark"] thead {
      background: #0b1728;
    }

    [data-theme="dark"] .next-name,
    [data-theme="dark"] .week-value,
    [data-theme="dark"] td,
    [data-theme="dark"] .mono {
      color: var(--text);
    }

    [data-theme="dark"] tr.current {
      background: #10284d;
    }

    [data-theme="dark"] td {
      border-top-color: var(--soft);
    }

    @media (max-width: 720px) {
      .portal-topbar-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .portal-controls {
        width: 100%;
        justify-content: space-between;
      }

      .portal-brand-logo {
        width: 88px;
      }

      .lang-btn,
      .theme-btn {
        padding: 7px 11px;
        font-size: 0.84rem;
      }

      .page {
        padding: 24px 16px 40px;
      }

      .app {
        padding: 22px;
        border-radius: 24px;
      }

      .card-body {
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-rows: auto auto auto;
      }

      .status-box {
        grid-column: 1 / 3;
        grid-row: 3;
        margin-top: 14px;
        min-height: 76px;
      }
    }

    @media (max-width: 430px) {
      .portal-topbar-inner { width: min(calc(100% - 24px), 1180px); }
      .portal-controls { gap: 8px; }
      .portal-lang-switcher, .portal-theme-switcher { gap: 3px; padding: 4px; }
      .lang-btn, .theme-btn { padding: 7px 9px; }

      .page { padding: 16px 12px 32px; }
      .app { padding: 18px; border-radius: 22px; }
      .app-header { align-items: flex-start; gap: 12px; margin-bottom: 20px; }
      .app-header h1 { font-size: 27px; }
      .subtitle { font-size: 13px; }
      .date-pill { padding: 7px 9px; font-size: 11px; }
      .card-body {
        padding: 24px 18px;
        display: flex;
        flex-direction: column;
        text-align: center;
      }
      .avatar { width: 64px; height: 64px; margin-bottom: 12px; }
      .holder { font-size: 36px; }
      .range { justify-content: center; margin-top: 6px; }
      .status-box { width: 100%; margin-top: 18px; }
      .next-card { padding: 16px; }
      .arrow-box { width: 42px; height: 42px; }
      .next-name { font-size: 18px; }
      .mono { font-size: 12px; }
    }
  </style>
</head>

<body>
  <header class="portal-topbar">
    <div class="portal-topbar-inner">
      <a class="portal-brand" href="https://tools.klncanada.com/" id="homeLink">
        <img class="portal-brand-logo" src="https://img.klncanada.com/company/logo/KLN%20Logo_colour_RGB.png" alt="KLN">
        <div>
          <h1 id="brandTitle">Portail Employés KLN</h1>
          <p id="brandSubtitle">Calendrier de stationnement</p>
        </div>
      </a>
      <div class="portal-controls">
        <div class="portal-lang-switcher" role="group" id="languageSwitcher">
          <button class="lang-btn" type="button" data-lang="fr">FR</button>
          <button class="lang-btn" type="button" data-lang="en">EN</button>
          <button class="lang-btn" type="button" data-lang="zh">中文</button>
        </div>
        <div class="portal-theme-switcher" role="group" id="themeSwitcher">
          <button class="theme-btn" type="button" data-theme-mode="auto" id="themeAuto">Auto</button>
          <button class="theme-btn" type="button" data-theme-mode="light" id="themeLight">Clair</button>
          <button class="theme-btn" type="button" data-theme-mode="dark" id="themeDark">Sombre</button>
        </div>
      </div>
    </div>
  </header>
  <div class="page">
    <main class="app">
      <header class="app-header">
        <div>
          <h1>
            <span id="icon-parking"></span>
            <span id="title"></span>
          </h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="date-pill">
          <span id="icon-clock"></span>
          <span id="today"></span>
        </div>
      </header>

      <section class="current-card">
        <div class="card-title" id="currentHolderLabel"></div>
        <div class="card-body">
          <div class="avatar" id="icon-user"></div>
          <h2 class="holder" id="currentName">...</h2>
          <div class="range">
            <span id="icon-calendar"></span>
            <span id="currentRange">-</span>
          </div>

          <div class="status-box">
            <div>
              <p class="status-label" id="statusLabel"></p>
              <span class="badge" id="inUseLabel"></span>
            </div>
            <div class="divider"></div>
            <div>
              <p class="status-label" id="cycleLabel"></p>
              <span class="week-value" id="currentWeek"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="next-card">
        <div class="next-left">
          <div class="arrow-box" id="icon-arrow"></div>
          <div>
            <p class="mini-label" id="nextWeekLabel"></p>
            <h3 class="next-name" id="nextName">-</h3>
          </div>
        </div>
        <div class="next-date">
          <p class="mini-label" id="startDateLabel"></p>
          <div class="mono" id="nextStart">-</div>
        </div>
      </section>

      <section class="schedule-section">
        <button class="toggle" id="toggleSchedule" type="button">
          <span class="toggle-left">
            <span id="icon-info"></span>
            <span id="viewFullLabel"></span>
          </span>
          <span class="chevron" id="icon-chevron"></span>
        </button>

        <div class="table-wrap" id="tableWrap">
          <table>
            <thead>
              <tr>
                <th id="tableWeekLabel"></th>
                <th id="tableRangeLabel"></th>
                <th id="tableHolderLabel"></th>
              </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
      </section>

      <footer id="footer"></footer>
      <div id="errorBox"></div>
    </main>
  </div>

          startDate: "开始日期",
          status: "状态",
          inUse: "使用中",
          cycle: "周次",
          weekShort: "周",
          viewFull: "查看排期表",
          tableWeek: "周次",
          tableRange: "日期范围",
          tableHolder: "持有人",
          footer: "184周起正式加入 Ruby 并更新顺延规则（Patricia 退出）。",
          now: "当前",
          error: "页面遇到错误，但不会白屏。"
        }
      };

      let state = {
        lang: getInitialLang(),
        theme: getInitialTheme(),
        showFullSchedule: false
      };

      function $(id) {
        return document.getElementById(id);
      }

      function getInitialLang() {
        try {
          const savedLang = localStorage.getItem("kln-portal-lang");
          if (["fr", "en", "zh"].includes(savedLang)) return savedLang;
        } catch (_) {}
        const browserLang = (navigator.language || "fr").toLowerCase();
        if (browserLang.startsWith("zh")) return "zh";
        if (browserLang.startsWith("fr")) return "fr";
        if (browserLang.startsWith("en")) return "en";
        return "fr";
      }

      function getInitialTheme() {
        try {
          const savedTheme = localStorage.getItem("kln-portal-theme-mode");
          return ["auto", "light", "dark"].includes(savedTheme) ? savedTheme : "auto";
        } catch (_) {
          return "auto";
        }
      }

      function applyTheme(persist) {
        const hour = new Date().getHours();
        const resolvedTheme = state.theme === "auto" ? (hour >= 19 || hour < 7 ? "dark" : "light") : state.theme;
        document.documentElement.dataset.themeMode = state.theme;
        document.documentElement.dataset.theme = resolvedTheme;

        document.querySelectorAll(".theme-btn").forEach(function (button) {
          const isActive = button.dataset.themeMode === state.theme;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", String(isActive));
        });

        if (persist) {
          try { localStorage.setItem("kln-portal-theme-mode", state.theme); } catch (_) {}
        }
      }

      function toDateString(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + d;
      }

      function parseLocalDate(dateString) {
        return new Date(dateString + "T00:00:00");
      }

      function getExternalData() {
        try {
          const savedData = localStorage.getItem("parking_custom_data");
          if (!savedData) return null;

          const parsed = JSON.parse(savedData);
          if (!Array.isArray(parsed)) return null;

          const valid = parsed.every(function (item) {
            return item &&
              typeof item.week !== "undefined" &&
              typeof item.start === "string" &&
              typeof item.end === "string" &&
              typeof item.name === "string";
          });

          return valid ? parsed : null;
        } catch (err) {
          try {
            localStorage.removeItem("parking_custom_data");
            localStorage.removeItem("parking_last_sync");
          } catch (_) {}
          return null;
        }
      }

      function buildScheduleData() {
        const externalData = getExternalData();
        if (externalData && externalData.length > 0) return externalData;

        const data = [];
        const startWeek = 148;
        const baseStartDate = new Date(2025, 7, 11);
        const changeWeek = 184;

        const namesOld = [
          "Nathalie", "Patricia", "Stacy", "Liliana", "Lucy", "Marianella",
          "Marla", "MaryZhou", "Karim", "Yan", "Marie-Eve", "Qing"
        ];

        const namesNew = [
          "Nathalie", "Stacy", "Liliana", "Lucy", "Marianella", "Marla",
          "MaryZhou", "Karim", "Yan", "Marie-Eve", "Qing", "Ruby"
        ];

        const today = new Date();
        const futureEnd = new Date(today);
        futureEnd.setFullYear(today.getFullYear() + 3);

        const weeksToGenerate = Math.ceil((futureEnd - baseStartDate) / (7 * 24 * 60 * 60 * 1000));
        const targetWeek = Math.max(startWeek + weeksToGenerate, 260);

        for (let w = startWeek; w <= targetWeek; w++) {
          const weeksDiff = w - startWeek;

          const monday = new Date(baseStartDate);
          monday.setDate(baseStartDate.getDate() + weeksDiff * 7);

          const friday = new Date(monday);
          friday.setDate(monday.getDate() + 4);

          let name;
          if (w < changeWeek) {
            name = namesOld[weeksDiff % namesOld.length];
          } else {
            const weeksDiffAfterChange = w - changeWeek;
            name = namesNew[weeksDiffAfterChange % namesNew.length];
          }

          data.push({
            week: w,
            start: toDateString(monday),
            end: toDateString(friday),
            name: name
          });
        }

        return data;
      }

      function getCurrentIndex(schedule) {
        const now = new Date();

        const index = schedule.findIndex(function (item) {
          const start = parseLocalDate(item.start);
          const nextMon = new Date(start);
          nextMon.setDate(start.getDate() + 7);
          return now >= start && now < nextMon;
        });

        if (index !== -1) return index;

        const nextIdx = schedule.findIndex(function (item) {
          return parseLocalDate(item.start) > now;
        });

        if (nextIdx > 0) return nextIdx - 1;
        return 0;
      }

      function formatDate(dateValue, lang) {
        if (!dateValue) return "";
        const d = parseLocalDate(dateValue);
        const locales = { fr: "fr-FR", en: "en-US", zh: "zh-CN" };
        return d.toLocaleDateString(locales[lang], { month: "short", day: "numeric" });
      }

      function render() {
        try {
          const t = translations[state.lang] || translations.fr;
          const schedule = buildScheduleData();
          const currentIndex = getCurrentIndex(schedule);
          const current = schedule[currentIndex] || null;
          const next = schedule[currentIndex + 1] || null;

          document.documentElement.lang = state.lang === "zh" ? "zh-CN" : state.lang;
          document.title = t.brandSubtitle + " | " + t.brandTitle;
          $("brandTitle").textContent = t.brandTitle;
          $("brandSubtitle").textContent = t.brandSubtitle;
          $("homeLink").setAttribute("aria-label", t.homeLinkLabel);
          $("languageSwitcher").setAttribute("aria-label", t.languageSwitcherLabel);
          $("themeSwitcher").setAttribute("aria-label", t.themeSwitcherLabel);
          $("themeAuto").textContent = t.themeAuto;
          $("themeLight").textContent = t.themeLight;
          $("themeDark").textContent = t.themeDark;

          $("title").textContent = t.title;
          $("subtitle").textContent = t.subtitle;
          $("currentHolderLabel").textContent = t.currentHolder;
          $("statusLabel").textContent = t.status;
          $("inUseLabel").textContent = t.inUse;
          $("cycleLabel").textContent = t.cycle;
          $("nextWeekLabel").textContent = t.nextWeek;
          $("startDateLabel").textContent = t.startDate;
          $("viewFullLabel").textContent = t.viewFull;
          $("tableWeekLabel").textContent = t.tableWeek;
          $("tableRangeLabel").textContent = t.tableRange;
          $("tableHolderLabel").textContent = t.tableHolder;
          $("footer").textContent = t.footer;

          const todayLocale = state.lang === "zh" ? "zh-CN" : state.lang === "fr" ? "fr-FR" : "en-US";
          $("today").textContent = new Date().toLocaleDateString(todayLocale);

          $("currentName").textContent = current ? current.name : "...";
          $("currentRange").textContent = current ? formatDate(current.start, state.lang) + " - " + formatDate(current.end, state.lang) : "-";
          $("currentWeek").textContent = current ? t.weekShort + " " + current.week : "-";

          $("nextName").textContent = next ? next.name : "-";
          $("nextStart").textContent = next ? formatDate(next.start, state.lang) : "-";

          document.querySelectorAll(".lang-btn").forEach(function (button) {
            const isActive = button.dataset.lang === state.lang;
            button.classList.toggle("active", isActive);
            button.setAttribute("aria-pressed", String(isActive));
          });

          applyTheme(false);

          $("tableWrap").classList.toggle("show", state.showFullSchedule);
          $("icon-chevron").classList.toggle("open", state.showFullSchedule);

          const startIdx = Math.max(0, currentIndex - 20);
          const endIdx = Math.min(schedule.length, currentIndex + 21);
          const displayedSchedule = schedule.slice(startIdx, endIdx);

          const tbody = $("scheduleBody");
          tbody.innerHTML = "";

          displayedSchedule.forEach(function (item) {
            const isCurrent = current && item.week === current.week && item.start === current.start;

            const tr = document.createElement("tr");
            if (isCurrent) tr.className = "current";

            const weekTd = document.createElement("td");
            weekTd.textContent = item.week;

            const rangeTd = document.createElement("td");
            rangeTd.textContent = formatDate(item.start, state.lang) + " - " + formatDate(item.end, state.lang);

            const holderTd = document.createElement("td");
            holderTd.textContent = item.name;

            if (isCurrent) {
              const badge = document.createElement("span");
              badge.className = "now-badge";
              badge.textContent = t.now;
              holderTd.appendChild(badge);
            }

            tr.appendChild(weekTd);
            tr.appendChild(rangeTd);
            tr.appendChild(holderTd);
            tbody.appendChild(tr);

            if (isCurrent && state.showFullSchedule) {
              setTimeout(function () {
                tr.scrollIntoView({ behavior: "auto", block: "start" });
              }, 50);
            }
          });

          $("errorBox").innerHTML = "";
        } catch (err) {
          const t = translations[state.lang] || translations.fr;
          $("errorBox").innerHTML = '<div class="error">' + t.error + '</div>';
          console.error(err);
        }
      }

      function init() {
        $("icon-parking").innerHTML = icons.parking;
        $("icon-clock").innerHTML = icons.clock;
        $("icon-user").innerHTML = icons.user;
        $("icon-calendar").innerHTML = icons.calendar;
        $("icon-arrow").innerHTML = icons.arrow;
        $("icon-info").innerHTML = icons.info;
        $("icon-chevron").innerHTML = icons.chevron;

        document.querySelectorAll(".lang-btn").forEach(function (button) {
          button.addEventListener("click", function () {
            state.lang = button.dataset.lang;
            try { localStorage.setItem("kln-portal-lang", state.lang); } catch (_) {}
            render();
          });
        });

        document.querySelectorAll(".theme-btn").forEach(function (button) {
          button.addEventListener("click", function () {
            state.theme = button.dataset.themeMode;
            applyTheme(true);
          });
        });

        $("toggleSchedule").addEventListener("click", function () {
          state.showFullSchedule = !state.showFullSchedule;
          render();
        });

        render();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
