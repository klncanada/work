<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLN Canada Office Directory</title>
  <script>
    (() => {
      const hour = new Date().getHours();
      const automaticTheme = hour >= 19 || hour < 7 ? 'dark' : 'light';

      try {
        const savedMode = localStorage.getItem('new-company-office-map-theme-mode');
        const mode = ['auto', 'light', 'dark'].includes(savedMode) ? savedMode : 'auto';
        document.documentElement.dataset.theme = mode === 'auto' ? automaticTheme : mode;
      } catch (error) {
        document.documentElement.dataset.theme = automaticTheme;
      }
    })();
  </script>
  <style>
    :root {
      --bg: #f5f7fb;
      --page-top: #eef4ff;
      --panel: #ffffff;
      --surface-2: #eef2f7;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #2563eb;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      --radius: 16px;
      --topbar-bg: rgba(255, 255, 255, 0.82);
      --topbar-border: rgba(219, 227, 240, 0.9);
      --switcher-bg: #f3f6fc;
      --active-control-bg: #ffffff;
      --panel-header: #fafbff;
      --cards-bg: #fdfeff;
      --active-card-bg: #f8faff;
      --tag-bg: #eff6ff;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #07111f;
      --page-top: #0b1728;
      --panel: #0f1b2d;
      --surface-2: #172a42;
      --text: #e5eefc;
      --muted: #9babc1;
      --line: #29415f;
      --brand: #60a5fa;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      --topbar-bg: rgba(7, 17, 31, 0.86);
      --topbar-border: rgba(41, 65, 95, 0.9);
      --switcher-bg: #101f33;
      --active-control-bg: #1b304a;
      --panel-header: #132137;
      --cards-bg: #0d192a;
      --active-card-bg: #13263e;
      --tag-bg: #172a42;
    }

    * { box-sizing: border-box; }

    /* Force full height and prevent main window scrolling */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, var(--page-top) 0%, var(--bg) 100%);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(calc(100% - 32px), 1440px);
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--topbar-border);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 12px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: 100px;
      height: 46px;
      padding: 3px 0;
      display: block;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .brand-text p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lang-switcher,
    .theme-switcher {
      display: inline-flex;
      gap: 6px;
      background: var(--switcher-bg);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }

    .lang-btn,
    .theme-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.92rem;
      transition: 0.2s ease;
    }

    .lang-btn.active,
    .theme-btn.active {
      background: var(--active-control-bg);
      color: var(--brand);
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.12);
      font-weight: 600;
    }

    .lang-btn:focus-visible,
    .theme-btn:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .page {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 72px);
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.8fr);
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header { 
      padding: 10px 16px; 
      border-bottom: 1px solid var(--line);
      background: var(--panel-header);
    }
    .panel-title { margin: 0; font-size: 14px; font-weight: 700; color: var(--text); }

    .map-wrap { 
      flex: 1; 
      position: relative; 
      background: var(--surface-2);
      min-height: 0;
    }
    
    #mapIframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .cards {
      padding: 10px;
      display: grid;
      gap: 8px;
      overflow-y: auto;
      background: var(--cards-bg);
      flex: 1;
    }

    .office-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--panel);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .office-card:hover, .office-card.active {
      border-color: var(--brand);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.05);
    }

    .office-card.active {
      border-left: 4px solid var(--brand);
      background: var(--active-card-bg);
    }

    .office-name { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
    .office-tag { 
      font-size: 10px; font-weight: 700; color: var(--brand); 
      text-transform: uppercase; background: var(--tag-bg); padding: 1px 6px; border-radius: 4px;
      display: inline-block; margin-bottom: 4px;
    }
    .office-address { margin: 4px 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    
    .contact-item { font-size: 12px; display: flex; gap: 8px; margin-top: 1px; }
    .contact-label { color: var(--muted); width: 24px; }

    @media (max-width: 980px) {
      html, body { overflow: auto; }
      .page { height: auto; }
      .layout { grid-template-columns: 1fr; height: auto; }
      .map-wrap { height: 350px; }
    }

    @media (max-width: 640px) {
      .topbar-inner {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .controls {
        width: 100%;
      }

      .page {
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="https://tools.klncanada.com/" data-i18n-aria-label="homeLinkLabel">
        <img class="brand-logo" src="https://img.klncanada.com/company/logo/KLN%20Logo_colour_RGB.png" alt="KLN">
        <div class="brand-text">
          <h1 data-i18n="brandTitle">KLN Employee Portal</h1>
          <p data-i18n="brandSubtitle">Office Directory</p>
        </div>
      </a>
      <div class="controls">
        <div class="lang-switcher" role="group" aria-label="Language switcher">
          <button class="lang-btn" type="button" data-lang="en">EN</button>
          <button class="lang-btn" type="button" data-lang="fr">FR</button>
        </div>
        <div class="theme-switcher" role="group" aria-label="Display mode" data-i18n-aria-label="themeModeLabel">
          <button class="theme-btn" type="button" data-theme-mode="auto" data-i18n="themeAuto">Auto</button>
          <button class="theme-btn" type="button" data-theme-mode="light" data-i18n="themeLight">Light</button>
          <button class="theme-btn" type="button" data-theme-mode="dark" data-i18n="themeDark">Dark</button>
        </div>
      </div>
    </div>
  </header>

  <div class="page">
    <section class="layout">
      <!-- Map Panel -->
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title" data-i18n="mapTitle">Location Map</h2>
        </div>
        <div class="map-wrap">
          <iframe 
            id="mapIframe" 
            loading="lazy" 
            allowfullscreen 
            src="about:blank">
          </iframe>
        </div>
      </div>

      <!-- List Panel -->
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title" data-i18n="listTitle">Offices</h2>
        </div>
        <div class="cards" id="officeCards"></div>
      </div>
    </section>
  </div>

  <script>
    const offices = [
      {
        id: "hq",
        name: "Montreal (Canada Headquarter)",
        tag: "headquarter",
        address: "1425 Trans Canada Route, Dorval, QC H9P 2W9, Canada",
        phone: "+1 514 822 4448",
        fax: "+1 514 822 4445"
      },
      {
        id: "wh",
        name: "Montreal (Warehouse)",
        tag: "warehouse",
        address: "9942 Chemin de la Côte-de-Liesse, Lachine, QC H8T 1A1, Canada",
        phone: "+1 514 420 0282",
        fax: "+1 514 636 5976"
      },
      {
        id: "to",
        name: "Toronto Office",
        tag: "office",
        address: "1450 Meyerside Drive, Mississauga, ON L5T 2N5, Canada",
        phone: "+1 905 565 8788",
        fax: "+1 905 565 8783"
      },
      {
        id: "van",
        name: "Vancouver Office",
        tag: "office",
        address: "13431 Maycrest Way, Richmond, BC V6V 2M3, Canada",
        phone: "N/A",
        fax: "N/A"
      }
    ];

    const i18n = {
      en: {
        brandTitle: 'KLN Employee Portal',
        brandSubtitle: 'Office Directory',
        homeLinkLabel: 'Go to the KLN Employee Portal homepage',
        themeModeLabel: 'Display mode',
        themeAuto: 'Auto',
        themeLight: 'Light',
        themeDark: 'Dark',
        mapTitle: 'Location Map',
        listTitle: 'Offices',
        headquarter: 'Headquarter',
        warehouse: 'Warehouse',
        office: 'Office',
        tel: 'Tel',
        fax: 'Fax'
      },
      fr: {
        brandTitle: 'Portail Employés KLN',
        brandSubtitle: 'Répertoire des bureaux',
        homeLinkLabel: 'Aller à la page d’accueil du Portail Employés KLN',
        themeModeLabel: 'Mode d’affichage',
        themeAuto: 'Auto',
        themeLight: 'Clair',
        themeDark: 'Sombre',
        mapTitle: 'Carte des sites',
        listTitle: 'Nos Emplacements',
        headquarter: 'Siège Social',
        warehouse: 'Entrepôt',
        office: 'Bureau',
        tel: 'Tél',
        fax: 'Fax'
      }
    };

    const supportedLangs = ['en', 'fr'];
    const supportedThemeModes = ['auto', 'light', 'dark'];
    const languageStorageKey = 'new-company-office-map-lang';
    const themeStorageKey = 'new-company-office-map-theme-mode';
    let currentLang = 'en';
    let selectedOfficeId = offices[0].id;

    function getText(key) {
      return i18n[currentLang][key] || key;
    }

    function renderUI() {
      const container = document.getElementById('officeCards');
      container.innerHTML = ''; // Clear for language switch

      offices.forEach((office) => {
        const card = document.createElement('div');
        card.className = `office-card ${office.id === selectedOfficeId ? 'active' : ''}`;
        card.id = `card-${office.id}`;
        card.innerHTML = `
          <span class="office-tag">${getText(office.tag)}</span>
          <h3 class="office-name">${office.name}</h3>
          <p class="office-address">${office.address}</p>
          <div class="contact-item"><span class="contact-label">${getText('tel')}</span><span>${office.phone}</span></div>
          <div class="contact-item"><span class="contact-label">${getText('fax')}</span><span>${office.fax}</span></div>
        `;
        card.onclick = () => selectOffice(office);
        container.appendChild(card);
      });

      // Update static text
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = getText(el.getAttribute('data-i18n'));
      });

      document.querySelectorAll('[data-i18n-aria-label]').forEach(el => {
        el.setAttribute('aria-label', getText(el.getAttribute('data-i18n-aria-label')));
      });
    }

    function selectOffice(office) {
      selectedOfficeId = office.id;
      
      // Update sidebar visual state
      document.querySelectorAll('.office-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${office.id}`);
      if (activeCard) activeCard.classList.add('active');

      // Refresh Map Iframe
      const encodedAddress = encodeURIComponent(office.address);
      const mapSrc = `https://maps.google.com/maps?q=${encodedAddress}&t=&z=16&ie=UTF8&iwloc=A&output=embed`;
      
      const iframe = document.getElementById('mapIframe');
      if (iframe.src !== mapSrc) {
        iframe.src = mapSrc;
      }
    }

    function normalizeLang(lang) {
      return String(lang || '').toLowerCase().startsWith('fr') ? 'fr' : 'en';
    }

    function detectInitialLanguage() {
      try {
        const saved = localStorage.getItem(languageStorageKey);
        if (supportedLangs.includes(saved)) return saved;
      } catch (error) {
        // Fall back to the browser language when storage is unavailable.
      }
      return normalizeLang(navigator.language);
    }

    function setLanguage(lang) {
      currentLang = supportedLangs.includes(lang) ? lang : 'en';
      document.documentElement.lang = currentLang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        const isActive = btn.dataset.lang === currentLang;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
      });
      renderUI();
      try {
        localStorage.setItem(languageStorageKey, currentLang);
      } catch (error) {
        // Keep the selected language for this page even when storage is unavailable.
      }
    }

    function getAutomaticTheme(date = new Date()) {
      const hour = date.getHours();
      return hour >= 19 || hour < 7 ? 'dark' : 'light';
    }

    function detectInitialThemeMode() {
      try {
        const saved = localStorage.getItem(themeStorageKey);
        return supportedThemeModes.includes(saved) ? saved : 'auto';
      } catch (error) {
        return 'auto';
      }
    }

    function getCurrentThemeMode() {
      return document.documentElement.dataset.themeMode || detectInitialThemeMode();
    }

    function applyTheme(mode, persist = true) {
      const selected = supportedThemeModes.includes(mode) ? mode : 'auto';
      const resolvedTheme = selected === 'auto' ? getAutomaticTheme() : selected;
      document.documentElement.dataset.themeMode = selected;
      document.documentElement.dataset.theme = resolvedTheme;

      document.querySelectorAll('.theme-btn').forEach(btn => {
        const isActive = btn.dataset.themeMode === selected;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
      });

      if (persist) {
        try {
          localStorage.setItem(themeStorageKey, selected);
        } catch (error) {
          // Keep the selected mode for this page even when storage is unavailable.
        }
      }
    }

    function refreshAutomaticTheme() {
      if (getCurrentThemeMode() === 'auto') applyTheme('auto', false);
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTheme(detectInitialThemeMode());
      setLanguage(detectInitialLanguage());
      selectOffice(offices[0]);

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.onclick = () => setLanguage(btn.getAttribute('data-lang'));
      });

      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.onclick = () => applyTheme(btn.dataset.themeMode);
      });

      setInterval(refreshAutomaticTheme, 60000);
    });
  </script>
</body>
</html>
