<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll Reminder</title>
  <script>
    (() => {
      const hour = new Date().getHours();
      const automaticTheme = hour >= 19 || hour < 7 ? 'dark' : 'light';
      try {
        const savedMode = localStorage.getItem('kln-portal-theme-mode') || localStorage.getItem('payrollTheme');
        const mode = ['auto', 'light', 'dark'].includes(savedMode) ? savedMode : 'auto';
        document.documentElement.dataset.theme = mode === 'auto' ? automaticTheme : mode;
      } catch (error) {
        document.documentElement.dataset.theme = automaticTheme;
      }
    })();
  </script>
  <style>
    :root {
      --bg1: #f5f7fb;
      --bg2: #eef3ff;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --blue: #2563eb;
      --blue-soft: #eaf1ff;
      --green: #16a34a;
      --orange: #f97316;
      --border: #e5e7eb;
      --shadow: rgba(15, 23, 42, 0.08);
      --topbar-bg: rgba(255, 255, 255, 0.82);
      --topbar-border: rgba(219, 227, 240, 0.9);
      --switcher-bg: #f3f6fc;
      --active-control-bg: #ffffff;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg1: #0f172a;
      --bg2: #111827;
      --card: #182235;
      --text: #f8fafc;
      --muted: #aab4c3;
      --blue: #60a5fa;
      --blue-soft: #1e3a5f;
      --border: #2b3648;
      --shadow: rgba(0, 0, 0, 0.35);
      --topbar-bg: rgba(7, 17, 31, 0.86);
      --topbar-border: rgba(41, 65, 95, 0.9);
      --switcher-bg: #101f33;
      --active-control-bg: #1b304a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      padding: 0 22px;
      transition: background .25s ease, color .25s ease;
    }

    .portal-topbar { position: sticky; top: 0; z-index: 30; margin: 0 -22px; backdrop-filter: blur(10px); background: var(--topbar-bg); border-bottom: 1px solid var(--topbar-border); }
    .portal-topbar-inner { width: min(calc(100% - 32px), 1180px); min-height: 72px; margin: 0 auto; padding: 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .portal-brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: inherit; text-decoration: none; }
    .portal-brand-logo { width: 100px; height: 46px; padding: 3px 0; object-fit: contain; flex: 0 0 auto; }
    .portal-brand h1 { margin: 0; font-size: 1.1rem; line-height: 1.2; }
    .portal-brand p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
    .portal-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .portal-lang-switcher, .portal-theme-switcher { display: inline-flex; gap: 6px; background: var(--switcher-bg); padding: 6px; border: 1px solid var(--border); border-radius: 999px; }
    .lang-btn, .theme-btn { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; font-size: .92rem; font-weight: 600; cursor: pointer; }
    .lang-btn.active, .theme-btn.active { background: var(--active-control-bg); color: var(--blue); box-shadow: 0 2px 10px rgba(37,99,235,.12); }
    .lang-btn:focus-visible, .theme-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .card {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 28px;
      box-shadow: 0 24px 60px var(--shadow);
      margin: 26px auto;
    }

    button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    button.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 34px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: 15px;
    }

    .hero {
      background: var(--blue-soft);
      border-radius: 26px;
      padding: 22px 26px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 28px;
      margin-bottom: 18px;
    }

    .hero-period, .hero-actions { min-width: 0; }
    .hero-actions { text-align: right; }

    .days-block { min-width: 175px; text-align: center; }

    .period {
      font-size: 20px;
      font-weight: 900;
      color: var(--blue);
      margin-bottom: 4px;
    }

    .period-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .days {
      font-size: 68px;
      font-weight: 900;
      color: var(--blue);
      line-height: 1;
    }

    .days-label {
      margin-top: 8px;
      font-size: 19px;
      font-weight: 800;
    }

    .payday-date {
      margin-top: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .message {
      margin-top: 12px;
      display: inline-block;
      background: rgba(255,255,255,.55);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 700;
    }

    html[data-theme="dark"] .message {
      background: rgba(255,255,255,.06);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 18px 0;
    }

    .mini {
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      background: rgba(255,255,255,.35);
    }

    html[data-theme="dark"] .mini {
      background: rgba(255,255,255,.04);
    }

    .mini-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .mini-value {
      font-size: 17px;
      font-weight: 850;
    }

    .section-title {
      font-size: 14px;
      font-weight: 850;
      margin: 22px 0 12px;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 17px;
    }

    .row strong {
      font-size: 15px;
    }

    .row span {
      color: var(--muted);
      font-size: 14px;
    }

    .tag {
      background: rgba(107, 114, 128, .12);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    @media (max-width: 620px) {
      body { padding: 0 16px; }
      .portal-topbar { margin: 0 -16px; }
      .portal-topbar-inner { align-items: flex-start; flex-wrap: wrap; }
      .portal-controls { width: 100%; }
      .card {
        padding: 22px;
        border-radius: 24px;
      }

      h1 { font-size: 27px; }
      .days { font-size: 58px; }

      .hero {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 22px;
        text-align: center;
      }

      .days-block { min-width: 0; }
      .hero-actions { text-align: center; }

      .grid {
        grid-template-columns: 1fr;
      }

      .row {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <header class="portal-topbar">
    <div class="portal-topbar-inner">
      <a class="portal-brand" href="https://tools.klncanada.com/" data-i18n-aria-label="homeLinkLabel">
        <img class="portal-brand-logo" src="https://img.klncanada.com/company/logo/KLN%20Logo_colour_RGB.png" alt="KLN">
        <div>
          <h1 data-i18n="brandTitle">KLN Employee Portal</h1>
          <p data-i18n="brandSubtitle">Payday</p>
        </div>
      </a>
      <div class="portal-controls">
        <div class="portal-lang-switcher" role="group" aria-label="Language switcher" data-i18n-aria-label="languageSwitcherLabel">
          <button id="langEn" class="lang-btn" type="button">EN</button>
          <button id="langFr" class="lang-btn" type="button">FR</button>
        </div>
        <div class="portal-theme-switcher" role="group" aria-label="Display mode" data-i18n-aria-label="themeModeLabel">
          <button id="themeAuto" class="theme-btn" type="button" data-i18n="auto">Auto</button>
          <button id="themeLight" class="theme-btn" type="button" data-i18n="light">Light</button>
          <button id="themeDark" class="theme-btn" type="button" data-i18n="dark">Dark</button>
        </div>
      </div>
    </div>
  </header>

  <main class="card">
    <h1 data-i18n="title">Next payday</h1>

    <section class="hero">
      <div class="hero-period">
        <div class="period" id="currentPeriod">Period --</div>
        <div class="period-sub" id="periodSub">Pay Period -- of 26</div>
      </div>
      <div class="days-block">
        <div class="days" id="daysLeft">--</div>
        <div class="days-label" id="daysLabel">days remaining</div>
      </div>
      <div class="hero-actions">
        <div class="payday-date" id="nextPayday">--</div>
        <div class="message" id="paydayMessage">Plan ahead.</div>
      </div>
    </section>

    <section class="grid">
      <div class="mini">
        <div class="mini-title" data-i18n="today">Today</div>
        <div class="mini-value" id="todayDate">--</div>
      </div>

      <div class="mini">
        <div class="mini-title" data-i18n="cycle">Payroll Cycle</div>
        <div class="mini-value" id="cycleRange">--</div>
      </div>
    </section>

    <div class="section-title" data-i18n="upcoming">Upcoming Paydays</div>
    <div class="list" id="paydayList"></div>

    <div class="note" data-i18n="note">
      Dates and period numbers are calculated automatically in your browser. Please contact Payroll or HR if you notice any discrepancy.
    </div>
  </main>

  <script>
    const basePayday = new Date(2026, 6, 2); // July 2, 2026 = Period 13
    const basePeriod = 13;
    const totalPeriods = 26;
    const intervalDays = 14;

    const i18n = {
      en: {
        brandTitle: "KLN Employee Portal",
        brandSubtitle: "Payday",
        homeLinkLabel: "Go to the KLN Employee Portal homepage",
        languageSwitcherLabel: "Language switcher",
        themeModeLabel: "Display mode",
        title: "Next payday",
        auto: "Auto",
        light: "Light",
        dark: "Dark",
        today: "Today",
        cycle: "Payroll Cycle",
        upcoming: "Upcoming Paydays",
        note: "Dates and period numbers are calculated automatically in your browser. Please contact Payroll or HR if you notice any discrepancy.",
        period: "Period",
        payPeriod: "Pay Period",
        of: "of",
        daysRemaining: "days remaining",
        dayRemaining: "day remaining",
        todayIsPayday: "Today is payday",
        todayTag: "Today",
        days: "days",
        messageToday: "Payday is today.",
        messageSoon: "Payday is coming soon.",
        messageNormal: "Plan ahead.",
        fromToday: "from today"
      },
      fr: {
        brandTitle: "Portail Employés KLN",
        brandSubtitle: "Paie",
        homeLinkLabel: "Aller à la page d’accueil du Portail Employés KLN",
        languageSwitcherLabel: "Sélecteur de langue",
        themeModeLabel: "Mode d’affichage",
        title: "Prochaine paie",
        auto: "Auto",
        light: "Clair",
        dark: "Sombre",
        today: "Aujourd’hui",
        cycle: "Cycle de paie",
        upcoming: "Prochaines paies",
        note: "Les dates et les numéros de période sont calculés automatiquement dans votre navigateur. Veuillez contacter la paie ou les RH en cas d’écart.",
        period: "Période",
        payPeriod: "Période de paie",
        of: "sur",
        daysRemaining: "jours restants",
        dayRemaining: "jour restant",
        todayIsPayday: "La paie est aujourd’hui",
        todayTag: "Aujourd’hui",
        days: "jours",
        messageToday: "La paie est aujourd’hui.",
        messageSoon: "La paie arrive bientôt.",
        messageNormal: "Planifiez à l’avance.",
        fromToday: "à partir d’aujourd’hui"
      }
    };

    const languageStorageKey = "kln-portal-lang";
    const themeStorageKey = "kln-portal-theme-mode";
    let lang = localStorage.getItem(languageStorageKey) || localStorage.getItem("payrollLang") ||
      (navigator.language.toLowerCase().startsWith("fr") ? "fr" : "en");

    let theme = localStorage.getItem(themeStorageKey) || localStorage.getItem("payrollTheme") || "auto";

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function diffDays(from, to) {
      return Math.round((to - from) / (24 * 60 * 60 * 1000));
    }

    function formatDate(date) {
      return date.toLocaleDateString(lang === "fr" ? "fr-CA" : "en-CA", {
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function formatTime(date) {
      return date.toLocaleTimeString(lang === "fr" ? "fr-CA" : "en-CA", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getPeriodNumber(payday) {
      const diffMs = payday - basePayday;
      const diffPeriods = Math.round(diffMs / (intervalDays * 24 * 60 * 60 * 1000));
      return basePeriod + diffPeriods;
    }

    function getDisplayPeriod(period) {
      return ((period - 1) % totalPeriods) + 1;
    }

    function getNextPayday() {
      let payday = new Date(basePayday);
      while (payday < today) payday = addDays(payday, intervalDays);
      return payday;
    }

    function getPayPeriodRange(payday) {
      const end = addDays(payday, -5);
      const start = addDays(end, -13);
      return { start, end };
    }

    function formatPayPeriodRange(payday) {
      const { start, end } = getPayPeriodRange(payday);
      const locale = lang === "fr" ? "fr-CA" : "en-CA";
      const monthDay = { month: "short", day: "numeric" };
      const monthDayYear = { month: "short", day: "numeric", year: "numeric" };
      const startText = start.toLocaleDateString(locale, start.getFullYear() === end.getFullYear() ? monthDay : monthDayYear);
      const endText = end.toLocaleDateString(locale, monthDayYear);
      return `${startText} – ${endText}`;
    }

    function applyLanguage() {
      const t = i18n[lang];

      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (t[key]) el.textContent = t[key];
      });

      document.querySelectorAll("[data-i18n-aria-label]").forEach(el => {
        const key = el.getAttribute("data-i18n-aria-label");
        if (t[key]) el.setAttribute("aria-label", t[key]);
      });

      document.getElementById("langEn").classList.toggle("active", lang === "en");
      document.getElementById("langFr").classList.toggle("active", lang === "fr");
      document.getElementById("langEn").setAttribute("aria-pressed", String(lang === "en"));
      document.getElementById("langFr").setAttribute("aria-pressed", String(lang === "fr"));

      render();
    }

    function applyTheme() {
      const hour = new Date().getHours();
      const autoDark = hour >= 19 || hour < 7;
      const dark = theme === "dark" || (theme === "auto" && autoDark);

      document.documentElement.dataset.themeMode = theme;
      document.documentElement.dataset.theme = dark ? "dark" : "light";

      document.getElementById("themeAuto").classList.toggle("active", theme === "auto");
      document.getElementById("themeLight").classList.toggle("active", theme === "light");
      document.getElementById("themeDark").classList.toggle("active", theme === "dark");
      document.getElementById("themeAuto").setAttribute("aria-pressed", String(theme === "auto"));
      document.getElementById("themeLight").setAttribute("aria-pressed", String(theme === "light"));
      document.getElementById("themeDark").setAttribute("aria-pressed", String(theme === "dark"));
    }

    function render() {
      const t = i18n[lang];
      const nextPayday = getNextPayday();
      const daysLeft = diffDays(today, nextPayday);
      const periodNumber = getPeriodNumber(nextPayday);
      const displayPeriod = getDisplayPeriod(periodNumber);

      document.getElementById("currentPeriod").textContent =
        `${t.period} ${displayPeriod}`;

      document.getElementById("periodSub").textContent =
        `${t.payPeriod} ${displayPeriod} ${t.of} ${totalPeriods}`;

      document.getElementById("daysLeft").textContent = daysLeft;

      document.getElementById("daysLabel").textContent =
        daysLeft === 0 ? t.todayIsPayday :
        daysLeft === 1 ? t.dayRemaining :
        t.daysRemaining;

      document.getElementById("nextPayday").textContent = formatDate(nextPayday);

      document.getElementById("paydayMessage").textContent =
        daysLeft === 0 ? t.messageToday :
        daysLeft <= 3 ? t.messageSoon :
        t.messageNormal;

      document.getElementById("todayDate").textContent = formatDate(today);
      document.getElementById("cycleRange").textContent = formatPayPeriodRange(nextPayday);

      const list = document.getElementById("paydayList");
      list.innerHTML = "";

      for (let i = 0; i < 6; i++) {
        const payday = addDays(nextPayday, i * intervalDays);
        const remaining = diffDays(today, payday);
        const period = getDisplayPeriod(getPeriodNumber(payday));

        const row = document.createElement("div");
        row.className = "row";

        row.innerHTML = `
          <div>
            <strong>${t.period} ${period}</strong><br>
            <span>${formatDate(payday)}</span>
          </div>
          <div class="tag">
            ${remaining === 0 ? t.todayTag : remaining + " " + t.days}
          </div>
        `;

        list.appendChild(row);
      }
    }

    document.getElementById("langEn").onclick = () => {
      lang = "en";
      localStorage.setItem(languageStorageKey, lang);
      localStorage.setItem("payrollLang", lang);
      applyLanguage();
    };

    document.getElementById("langFr").onclick = () => {
      lang = "fr";
      localStorage.setItem(languageStorageKey, lang);
      localStorage.setItem("payrollLang", lang);
      applyLanguage();
    };

    document.getElementById("themeAuto").onclick = () => {
      theme = "auto";
      localStorage.setItem(themeStorageKey, theme);
      localStorage.setItem("payrollTheme", theme);
      applyTheme();
    };

    document.getElementById("themeLight").onclick = () => {
      theme = "light";
      localStorage.setItem(themeStorageKey, theme);
      localStorage.setItem("payrollTheme", theme);
      applyTheme();
    };

    document.getElementById("themeDark").onclick = () => {
      theme = "dark";
      localStorage.setItem(themeStorageKey, theme);
      localStorage.setItem("payrollTheme", theme);
      applyTheme();
    };

    applyTheme();
    applyLanguage();

    setInterval(() => {
      if (theme === "auto") applyTheme();
    }, 60000);
  </script>

</body>
</html>
