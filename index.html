<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        .hero {
            padding: 20px;
        }
        .card-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }
        .card {
            min-height: 150px; /* Change this value to set your desired height */
            /* Additional styles for your cards */
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Welcome to My Website</h1>
    </div>
    <div class="card-container">
        <div class="card">
            <h2>Card 1</h2>
        </div>
        <div class="card">
            <h2>Card 2</h2>
        </div>
        <div class="card">
            <h2>Card 3</h2>
        </div>
        <div class="card">
            <h2>Directory</h2>
            <a href="https://tools.klncanada.com/Directory/">📇</a>
        </div>
    </div>
</body>
</html>
