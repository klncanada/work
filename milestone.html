<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLN Canada Timeline</title>
  <style>
    :root {
      --bg: #f6f9fd;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #d6e4f5;
      --primary: #2563eb;
      --primary-soft: #eaf2ff;
      --border: #dbe7f5;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      --hover-shadow: 0 24px 70px rgba(37, 99, 235, 0.16);
    }

    [data-theme="dark"] {
      --bg: #07111f;
      --panel: #0f1b2d;
      --text: #e5eefc;
      --muted: #93a4ba;
      --line: #243b5a;
      --primary: #60a5fa;
      --primary-soft: rgba(96, 165, 250, 0.14);
      --border: #233a58;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      --hover-shadow: 0 24px 70px rgba(96, 165, 250, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.11), transparent 34%),
        var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 24px 56px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      width: 88px;
      height: 62px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0b2d5e, #2563eb);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .intro {
      margin: 28px 0 12px;
      padding: 24px 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: center;
    }

    .intro strong {
      font-size: 23px;
      letter-spacing: -0.025em;
    }

    .intro p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .range {
      display: inline-flex;
      border-radius: 999px;
      padding: 9px 15px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 900;
      white-space: nowrap;
    }

    .timeline {
      position: relative;
      padding: 34px 0 0;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 150px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, #2563eb, #8b5cf6, #10b981, #f97316, #14b8a6, #22c55e);
      border-radius: 99px;
    }

    .item {
      --cat: #2563eb;
      --cat-soft: rgba(37, 99, 235, 0.12);
      position: relative;
      display: grid;
      grid-template-columns: 120px 58px 1fr;
      gap: 24px;
      margin-bottom: 26px;
      align-items: start;
    }

    .date {
      text-align: right;
      padding-top: 17px;
    }

    .year {
      color: var(--cat);
      font-size: 24px;
      font-weight: 950;
      letter-spacing: -0.04em;
    }

    .month {
      margin-top: 4px;
      color: var(--muted);
      font-weight: 800;
      font-size: 14px;
    }

    .dot-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      padding-top: 8px;
    }

    .dot {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--cat);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
      box-shadow: 0 16px 32px color-mix(in srgb, var(--cat) 32%, transparent);
      z-index: 1;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .connector {
      position: absolute;
      top: 36px;
      left: 52px;
      width: 24px;
      height: 2px;
      background: var(--cat);
      opacity: 0.75;
    }

    .dot svg {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .item:hover .card {
      transform: translateY(-5px);
      box-shadow: var(--hover-shadow);
      border-color: color-mix(in srgb, var(--cat) 45%, var(--border));
    }

    .item:hover .dot {
      transform: scale(1.09) rotate(-3deg);
      box-shadow: 0 20px 42px color-mix(in srgb, var(--cat) 42%, transparent);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .title {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
      letter-spacing: -0.03em;
      color: color-mix(in srgb, var(--cat) 55%, var(--text));
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 7px 12px;
      background: var(--cat-soft);
      color: var(--cat);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 16px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.03);
    }

    .quote-box {
      margin-top: 36px;
      position: relative;
      overflow: hidden;
      padding: 28px 30px;
      border-radius: 28px;
      background:
        linear-gradient(135deg, var(--primary-soft), transparent),
        var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .quote-symbol {
      font-size: 46px;
      line-height: 1;
      color: var(--primary);
      font-weight: 950;
      opacity: 0.45;
    }

    .quote-text {
      margin: 0;
      font-size: clamp(20px, 2.4vw, 30px);
      line-height: 1.35;
      font-weight: 900;
      letter-spacing: -0.035em;
    }

    .quote-fr {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      font-style: italic;
    }

    .quote-source {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .quote-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 22px;
    }

    .quote-dots {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quote-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      background: color-mix(in srgb, var(--primary) 25%, transparent);
      cursor: pointer;
    }

    .quote-dot.active {
      background: var(--primary);
      transform: scale(1.25);
    }

    .quote-nav {
      display: flex;
      gap: 8px;
    }

    .quote-nav button {
      width: 38px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .fade {
      animation: fadeUp 0.32s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .page { padding: 24px 16px 40px; }

      header,
      .intro {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls { justify-content: flex-start; }

      .timeline::before { left: 29px; }

      .item {
        grid-template-columns: 58px 1fr;
        gap: 16px;
      }

      .date {
        grid-column: 2;
        grid-row: 1;
        text-align: left;
        padding-top: 0;
      }

      .dot-wrap {
        grid-column: 1;
        grid-row: 1 / span 2;
      }

      .connector { display: none; }

      .card {
        grid-column: 2;
        grid-row: 2;
        padding: 20px;
      }

      .card-top { flex-direction: column; }

      .title { font-size: 21px; }

      .quote-actions {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="logo">KLN</div>
        <div>
          <h1 data-i18n="pageTitle">KLN Canada Timeline</h1>
          <p class="subtitle" data-i18n="pageSubtitle">Key milestones in our Canadian journey.</p>
        </div>
      </div>

      <div class="controls">
        <button id="langEn">EN</button>
        <button id="langFr">FR</button>
        <button id="themeBtn">Dark</button>
      </div>
    </header>

    <section class="intro">
      <div>
        <strong data-i18n="introTitle">Company Milestones</strong>
        <p data-i18n="introText">
          A simplified visual history of KLN Canada, from TLP’s founding to the KLN legal name transition.
        </p>
      </div>
      <span class="range">1998 – 2025</span>
    </section>

    <main class="timeline" id="timeline"></main>

    <section class="quote-box" aria-label="KLN quotes">
      <div class="quote-symbol">“</div>
      <p class="quote-text fade" id="quoteText"></p>
      <p class="quote-fr fade" id="quoteTranslation"></p>
      <div class="quote-source" id="quoteSource"></div>

      <div class="quote-actions">
        <div class="quote-dots" id="quoteDots"></div>
        <div class="quote-nav">
          <button id="quotePrev" aria-label="Previous quote">‹</button>
          <button id="quoteNext" aria-label="Next quote">›</button>

    </section>
  </div>

    const events = [

    const quotes = [
      {
        en: "To inspire a world without boundaries by leading customer-centric, global supply chain solutions.",
        fr: "Inspirer un monde sans frontières en dirigeant des solutions de chaîne d’approvisionnement mondiales centrées sur le client.",
        source: "KLN Vision"
      },
      {
        en: "Rooted in Asia, we deliver customer-centric, end-to-end supply chain solutions that connect markets and power global trade.",
        fr: "Ancrés en Asie, nous offrons des solutions de chaîne d’approvisionnement complètes et centrées sur le client qui relient les marchés et soutiennent le commerce mondial.",
        source: "KLN Mission"
      },
      {

        fr: "En vous associant à KLN, vous vous associez à un réseau puissant.",

      },
      {
        en: "A commitment to success.",

        source: "KLN Philosophy"
      },
      {

        fr: "Nous nous engageons à créer une réelle valeur pour nos parties prenantes grâce à des solutions innovantes, des résultats durables et une croissance à long terme.",
        source: "KLN Philosophy"
      },
      {
        en: "KLN is an Asia-rooted, global 3PL delivering customer-centric, end-to-end supply chain solutions that connect markets and power global trade.",
        fr: "KLN est un fournisseur mondial de logistique tierce partie enraciné en Asie, offrant des solutions complètes centrées sur le client qui relient les marchés et soutiennent le commerce mondial.",
        source: "KLN About Us"
      }
    ];

    let currentLang = (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en";
    let currentTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    let quoteIndex = 0;
    let quoteTimer;

    const timeline = document.getElementById("timeline");
    const langEn = document.getElementById("langEn");
    const langFr = document.getElementById("langFr");
    const themeBtn = document.getElementById("themeBtn");
    const quoteText = document.getElementById("quoteText");
    const quoteTranslation = document.getElementById("quoteTranslation");
    const quoteSource = document.getElementById("quoteSource");
    const quoteDots = document.getElementById("quoteDots");

    function formatDate(dateString, lang) {
      const date = new Date(dateString + "T00:00:00");
      return {
        year: date.getFullYear(),
        month: date.toLocaleDateString(lang === "fr" ? "fr-CA" : "en-CA", { month: "short", day: "2-digit" }),
        full: date.toLocaleDateString(lang === "fr" ? "fr-CA" : "en-CA", {
          year: "numeric",
          month: "long",
          day: "numeric"
        })
      };
    }

    function renderTimeline() {
      timeline.innerHTML = "";

      events
        .slice()
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .forEach((event) => {
          const d = formatDate(event.date, currentLang);
          const style = categoryStyles[event.category] || categoryStyles.Foundation;

          const item = document.createElement("article");
          item.className = "item";
          item.style.setProperty("--cat", style.color);
          item.style.setProperty("--cat-soft", style.soft);

          item.innerHTML = `
            <div class="date">
              <div class="year">${d.year}</div>
              <div class="month">${d.month}</div>
            </div>

            <div class="dot-wrap">
              <div class="dot">${icons[style.icon]}</div>
              <div class="connector"></div>
            </div>

            <div class="card">
              <div class="card-top">
                <h2 class="title">${event["title_" + currentLang]}</h2>
                <span class="tag">${event.category}</span>
              </div>

              <p class="desc">${event["desc_" + currentLang]}</p>

              <div class="meta">
                <span class="pill">${translations[currentLang].date}: ${d.full}</span>
                <span class="pill">${translations[currentLang].category}: ${event.category}</span>
              </div>
            </div>
          `;

          timeline.appendChild(item);
        });
    }

    function renderQuote() {
      const q = quotes[quoteIndex];

      quoteText.classList.remove("fade");
      quoteTranslation.classList.remove("fade");
      void quoteText.offsetWidth;

      quoteText.textContent = currentLang === "fr" ? q.fr : q.en;
      quoteTranslation.textContent = currentLang === "fr" ? q.en : q.fr;
      quoteSource.textContent = "— " + q.source;

      quoteText.classList.add("fade");
      quoteTranslation.classList.add("fade");

      quoteDots.innerHTML = "";
      quotes.forEach((_, i) => {
        const dot = document.createElement("button");
        dot.className = "quote-dot" + (i === quoteIndex ? " active" : "");
        dot.setAttribute("aria-label", "Quote " + (i + 1));
        dot.addEventListener("click", () => {
          quoteIndex = i;
          renderQuote();
          restartQuoteTimer();
        });
        quoteDots.appendChild(dot);
      });
    }

    function nextQuote() {
      quoteIndex = (quoteIndex + 1) % quotes.length;
      renderQuote();
    }

    function prevQuote() {
      quoteIndex = (quoteIndex - 1 + quotes.length) % quotes.length;
      renderQuote();
    }

    function restartQuoteTimer() {
      clearInterval(quoteTimer);
      quoteTimer = setInterval(nextQuote, 5200);
    }

    function applyLanguage() {
      document.documentElement.lang = currentLang;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.textContent = translations[currentLang][key];
      });

      langEn.classList.toggle("active", currentLang === "en");
      langFr.classList.toggle("active", currentLang === "fr");

      applyTheme();
      renderTimeline();
      renderQuote();
    }

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", currentTheme);
      themeBtn.textContent =
        currentTheme === "dark"
          ? translations[currentLang].themeLight
          : translations[currentLang].themeDark;
    }

    langEn.addEventListener("click", () => {
      currentLang = "en";
      applyLanguage();
    });

    langFr.addEventListener("click", () => {
      currentLang = "fr";
      applyLanguage();
    });

    themeBtn.addEventListener("click", () => {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      applyTheme();
    });

    document.getElementById("quoteNext").addEventListener("click", () => {
      nextQuote();
      restartQuoteTimer();
    });

    document.getElementById("quotePrev").addEventListener("click", () => {
      prevQuote();
      restartQuoteTimer();
    });

    applyTheme();
    applyLanguage();
    restartQuoteTimer();
  </script>
</body>
</html>
