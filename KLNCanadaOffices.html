<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLN Canada Office Directory</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #2563eb;
      --shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    /* Force full height and prevent main window scrolling */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .page-title { margin: 0; font-size: 22px; font-weight: 700; }

    /* Language Switcher Styles */
    .lang-switcher {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.6);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }

    .lang-btn {
      border: 0;
      background: transparent;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: var(--brand);
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.8fr);
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header { 
      padding: 10px 16px; 
      border-bottom: 1px solid var(--line);
      background: #fafbff;
    }
    .panel-title { margin: 0; font-size: 14px; font-weight: 700; color: #4b5563; }

    .map-wrap { 
      flex: 1; 
      position: relative; 
      background: #eef2f7; 
      min-height: 0;
    }
    
    #mapIframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .cards {
      padding: 10px;
      display: grid;
      gap: 8px;
      overflow-y: auto;
      background: #fdfeff;
      flex: 1;
    }

    .office-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .office-card:hover, .office-card.active {
      border-color: #bfdbfe;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.05);
    }

    .office-card.active {
      border-left: 4px solid var(--brand);
      background: #f8faff;
    }

    .office-name { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
    .office-tag { 
      font-size: 10px; font-weight: 700; color: var(--brand); 
      text-transform: uppercase; background: #eff6ff; padding: 1px 6px; border-radius: 4px;
      display: inline-block; margin-bottom: 4px;
    }
    .office-address { margin: 4px 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    
    .contact-item { font-size: 12px; display: flex; gap: 8px; margin-top: 1px; }
    .contact-label { color: var(--muted); width: 24px; }

    @media (max-width: 980px) {
      html, body { overflow: auto; }
      .page { height: auto; }
      .layout { grid-template-columns: 1fr; height: auto; }
      .map-wrap { height: 350px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1 class="page-title" data-i18n="pageTitle">Office Directory</h1>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fr">FR</button>
      </div>
    </div>

    <section class="layout">
      <!-- Map Panel -->
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title" data-i18n="mapTitle">Location Map</h2>
        </div>
        <div class="map-wrap">
          <iframe 
            id="mapIframe" 
            loading="lazy" 
            allowfullscreen 
            src="about:blank">
          </iframe>
        </div>
      </div>

      <!-- List Panel -->
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title" data-i18n="listTitle">Offices</h2>
        </div>
        <div class="cards" id="officeCards"></div>
      </div>
    </section>
  </div>

  <script>
    const offices = [
      {
        id: "hq",
        name: "Montreal (Canada Headquarter)",
        tag: "headquarter",
        address: "1425 Trans Canada Route, Dorval, QC H9P 2W9, Canada",
        phone: "+1 514 822 4448",
        fax: "+1 514 822 4445"
      },
      {
        id: "wh",
        name: "Montreal (Warehouse)",
        tag: "warehouse",
        address: "9942 Chemin de la Côte-de-Liesse, Lachine, QC H8T 1A1, Canada",
        phone: "+1 514 420 0282",
        fax: "+1 514 636 5976"
      },
      {
        id: "to",
        name: "Toronto Office",
        tag: "office",
        address: "1450 Meyerside Drive, Mississauga, ON L5T 2N5, Canada",
        phone: "+1 905 565 8788",
        fax: "+1 905 565 8783"
      },
      {
        id: "van",
        name: "Vancouver Office",
        tag: "office",
        address: "13431 Maycrest Way, Richmond, BC V6V 2M3, Canada",
        phone: "N/A",
        fax: "N/A"
      }
    ];

    const i18n = {
      en: {
        pageTitle: 'Office Directory',
        mapTitle: 'Location Map',
        listTitle: 'Offices',
        headquarter: 'Headquarter',
        warehouse: 'Warehouse',
        office: 'Office',
        tel: 'Tel',
        fax: 'Fax'
      },
      fr: {
        pageTitle: 'Bureaux KLN Canada',
        mapTitle: 'Carte des sites',
        listTitle: 'Nos Emplacements',
        headquarter: 'Siège Social',
        warehouse: 'Entrepôt',
        office: 'Bureau',
        tel: 'Tél',
        fax: 'Fax'
      }
    };

    let currentLang = 'en';
    let selectedOfficeId = offices[0].id;

    function getText(key) {
      return i18n[currentLang][key] || key;
    }

    function renderUI() {
      const container = document.getElementById('officeCards');
      container.innerHTML = ''; // Clear for language switch

      offices.forEach((office) => {
        const card = document.createElement('div');
        card.className = `office-card ${office.id === selectedOfficeId ? 'active' : ''}`;
        card.id = `card-${office.id}`;
        card.innerHTML = `
          <span class="office-tag">${getText(office.tag)}</span>
          <h3 class="office-name">${office.name}</h3>
          <p class="office-address">${office.address}</p>
          <div class="contact-item"><span class="contact-label">${getText('tel')}</span><span>${office.phone}</span></div>
          <div class="contact-item"><span class="contact-label">${getText('fax')}</span><span>${office.fax}</span></div>
        `;
        card.onclick = () => selectOffice(office);
        container.appendChild(card);
      });

      // Update static text
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = getText(el.getAttribute('data-i18n'));
      });
    }

    function selectOffice(office) {
      selectedOfficeId = office.id;
      
      // Update sidebar visual state
      document.querySelectorAll('.office-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${office.id}`);
      if (activeCard) activeCard.classList.add('active');

      // Refresh Map Iframe
      const encodedAddress = encodeURIComponent(office.address);
      const mapSrc = `https://maps.google.com/maps?q=${encodedAddress}&t=&z=16&ie=UTF8&iwloc=A&output=embed`;
      
      const iframe = document.getElementById('mapIframe');
      if (iframe.src !== mapSrc) {
        iframe.src = mapSrc;
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });
      renderUI();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderUI();
      selectOffice(offices[0]);

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.onclick = () => setLanguage(btn.getAttribute('data-lang'));
      });
    });
  </script>
</body>
</html>
