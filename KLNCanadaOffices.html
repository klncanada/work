<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLN Canada Office Directory (Iframe Embed)</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #2563eb;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 220px);
      color: var(--text);
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .page-title { margin: 0; font-size: 28px; font-weight: 700; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.9fr);
      gap: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header { padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .panel-title { margin: 0; font-size: 18px; font-weight: 700; }

    .map-wrap { position: relative; height: 620px; background: #eef2f7; }
    
    #mapIframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .cards {
      padding: 16px;
      display: grid;
      gap: 14px;
      max-height: 620px;
      overflow-y: auto;
    }

    .office-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .office-card:hover, .office-card.active {
      transform: translateY(-2px);
      border-color: #bfdbfe;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.12);
    }

    .office-card.active {
      border-left: 5px solid var(--brand);
      background: #f8faff;
    }

    .office-name { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
    .office-tag { 
      font-size: 11px; font-weight: 700; color: var(--brand); 
      text-transform: uppercase; background: #eff6ff; padding: 2px 6px; border-radius: 4px;
    }
    .office-address { margin: 8px 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    
    .contact-item { font-size: 13px; display: flex; gap: 8px; margin-top: 4px; }
    .contact-label { color: var(--muted); width: 30px; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .map-wrap { height: 400px; }
      .cards { max-height: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1 class="page-title">Office Directory</h1>
    </div>

    <section class="layout">
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Location Map</h2>
        </div>
        <div class="map-wrap">
          <iframe 
            id="mapIframe" 
            loading="lazy" 
            allowfullscreen 
            src="about:blank">
          </iframe>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Offices</h2>
        </div>
        <div class="cards" id="officeCards"></div>
      </div>
    </section>
  </div>

  <script>
    // No coordinates needed, just addresses
    const offices = [
      {
        id: "hq",
        name: "Montreal (Canada Headquarter)",
        tag: "headquarter",
        address: "1425 TransCanada Highway, Dorval, QC H9P 2W9, Canada",
        phone: "+1 514 822 4448",
        fax: "+1 514 822 4445"
      },
      {
        id: "wh",
        name: "Montreal (Warehouse)",
        tag: "warehouse",
        address: "9942 Chemin de la Côte-de-Liesse, Lachine, QC H8T 1A1, Canada",
        phone: "+1 514 420 0282",
        fax: "+1 514 636 5976"
      },
      {
        id: "to",
        name: "Toronto Office",
        tag: "office",
        address: "1450 Meyerside Drive, Mississauga, ON L5T 2N5, Canada",
        phone: "+1 905 565 8788",
        fax: "+1 905 565 8783"
      },
      {
        id: "van",
        name: "Vancouver Office",
        tag: "office",
        address: "13431 Maycrest Way, Richmond, BC V6V 2M3, Canada",
        phone: "N/A",
        fax: "N/A"
      }
    ];

    function renderUI() {
      const container = document.getElementById('officeCards');
      offices.forEach((office, index) => {
        const card = document.createElement('div');
        card.className = 'office-card';
        card.id = `card-${office.id}`;
        card.innerHTML = `
          <span class="office-tag">${office.tag}</span>
          <h3 class="office-name">${office.name}</h3>
          <p class="office-address">${office.address}</p>
          <div class="contact-item"><span class="contact-label">Tel</span><span>${office.phone}</span></div>
          <div class="contact-item"><span class="contact-label">Fax</span><span>${office.fax}</span></div>
        `;
        card.onclick = () => selectOffice(office);
        container.appendChild(card);
      });
      
      // Default selection
      selectOffice(offices[0]);
    }

    function selectOffice(office) {
      // Update sidebar UI
      document.querySelectorAll('.office-card').forEach(c => c.classList.remove('active'));
      document.getElementById(`card-${office.id}`).classList.add('active');

      // Update Map Iframe
      // We use the standard google.com/maps?q=ADDRESS&output=embed URL
      const encodedAddress = encodeURIComponent(office.address);
      const mapSrc = `https://maps.google.com/maps?q=${encodedAddress}&t=&z=14&ie=UTF8&iwloc=&output=embed`;
      
      const iframe = document.getElementById('mapIframe');
      if (iframe.src !== mapSrc) {
        iframe.src = mapSrc;
      }
    }

    document.addEventListener('DOMContentLoaded', renderUI);
  </script>
</body>
</html>
